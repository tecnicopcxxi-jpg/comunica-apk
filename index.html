// Habla: separamos "¿se entendió?" (lo juzga quien acompaña) de lo que "cree" el reconocimiento automático,
// que es orientativo y nunca se presenta como un fracaso de la persona.
async function renderSayPractice(){
  const p = await loadProfile(state.currentId);
  const { target, feedback, listening, recording, recordingUrl, autoNote, exact } = state.practice;
  const wrap = el('div',{class:'practice-wrap'});
  const SR = getSpeechRecognition();
  const canRec = canRecordAudio();

  wrap.appendChild(el('div',{class:'practice-prompt'},[
    el('div',{class:'section-sub'},'🗣️ Mirá, escuchá y, si querés, probá decir la palabra'),
    el('div',{class:'say-target'},[
      el('span',{class:'say-emoji'}, target.emoji), el('div',{class:'big-word'}, target.label),
      el('button',{class:'say-btn scan-item', 'data-scan-label':'Escuchar de nuevo', onclick:()=>speakItem(p, target)},[el('span',{},'🔊 '),'Escuchar de nuevo'])
    ])
  ]));
  wrap.appendChild(feedbackBanner(feedback));
  if(autoNote) wrap.appendChild(el('div',{class:'oral-note'}, autoNote));

  const methodsWrap = el('div',{class:'say-methods'});

  if(SR){
    const block = el('div',{class:'say-method-block'});
    block.appendChild(el('div',{class:'say-method-title'}, '🎙️ Reconocimiento automático (orientativo)'));
    block.appendChild(el('button',{class:'mic-btn scan-item'+(listening?' listening':''), 'data-scan-label':'Grabar y verificar', onclick:()=>{
      if(state.practice.listening) return;
      try{
        const rec = new SR(); rec.lang='es-ES'; rec.maxAlternatives=3;
        state.practice.rec = rec;
        state.practice.listening = true; render();
        rec.onresult = async (ev)=>{
          const heard = normalizeWord(ev.results[0][0].transcript);
          const expected = normalizeWord(target.label);
          const isMatch = heard.length>=2 && (heard.includes(expected) || (heard.length>=Math.ceil(expected.length*0.6) && expected.includes(heard)));
          p.progress.oralAutoChecks = (p.progress.oralAutoChecks||0) + 1;
          if(isMatch) p.progress.oralAutoMatches = (p.progress.oralAutoMatches||0) + 1;
          state.practice.listening = false;
          state.practice.feedback = isMatch ? 'good' : null;
          state.practice.autoNote = isMatch
            ? '🎧 El reconocimiento automático coincidió con la palabra. Igual, quien acompaña puede confirmar abajo.'
            : '🎧 El reconocimiento automático no pudo confirmarlo. Eso no quiere decir que se haya dicho mal: puede fallar con voces suaves, infantiles o con ruido. Quien acompaña puede marcar abajo si se entendió.';
          await saveProfile(p); render();
        };
        rec.onerror = ()=>{ state.practice.listening=false; state.practice.autoNote='🎧 No se pudo usar el reconocimiento automático (falta el permiso del micrófono, o no hay conexión). No pasa nada: quien acompaña puede marcar abajo si se entendió.'; render(); };
        rec.onend = ()=>{ if(state.practice.listening){ state.practice.listening=false; render(); } };
        rec.start();
      }catch(e){ state.practice.listening=false; render(); }
    }},[ el('span',{}, listening?'🎙️':'🎤'), listening? 'Escuchando…' : 'Probar con reconocimiento' ]));
    methodsWrap.appendChild(block);
  }

  if(canRec){
    const block = el('div',{class:'say-method-block'});
    block.appendChild(el('div',{class:'say-method-title'}, '⏺️ Escucharse (la grabación no se guarda)'));
    if(!recordingUrl){
      block.appendChild(el('button',{class:'mic-btn record scan-item'+(recording?' recording':''), 'data-scan-label':'Grabar mi voz', onclick: async ()=>{
        if(state.practice.recording){
          if(state.practice.mediaRecorder) state.practice.mediaRecorder.stop();
          return;
        }
        try{
          const stream = await navigator.mediaDevices.getUserMedia({audio:true});
          activeMicStream = stream;
          const chunks = [];
          const mr = new MediaRecorder(stream);
          mr.ondataavailable = e=>{ if(e.data && e.data.size>0) chunks.push(e.data); };
          mr.onstop = ()=>{
            const blob = new Blob(chunks, {type: mr.mimeType || 'audio/webm'});
            state.practice.recordingUrl = URL.createObjectURL(blob);
            state.practice.recording = false;
            stream.getTracks().forEach(t=>t.stop());
            activeMicStream = null;
            render();
          };
          state.practice.mediaRecorder = mr;
          state.practice.recording = true;
          mr.start();
          render();
        }catch(e){ alert('No se pudo acceder al micrófono. Revisá los permisos del navegador.'); }
      }},[ el('span',{}, recording?'⏹️':'⏺️'), recording ? 'Detener grabación' : 'Grabar mi voz' ]));
    }else{
      block.appendChild(el('audio',{controls:'controls', src:recordingUrl}));
      block.appendChild(el('div',{class:'manual-check'},[
        el('button',{class:'pill-btn', onclick:()=>{
          if(state.practice.recordingUrl) URL.revokeObjectURL(state.practice.recordingUrl);
          state.practice.recordingUrl = null; render();
        }}, '🗑 Descartar grabación')
      ]));
    }
    methodsWrap.appendChild(block);
  }
  if(SR || canRec) wrap.appendChild(methodsWrap);
  else wrap.appendChild(el('div',{class:'helper-note'}, '🎤 Este navegador no permite grabar ni reconocer la voz. Está bien: se puede practicar igual, y quien acompaña marca abajo si se entendió.'));

  // Evaluación manual (siempre disponible): lo que realmente cuenta es si se entiende, no si suena idéntico al modelo.
  const evalBox = el('div',{class:'oral-eval'},[
    el('div',{class:'say-method-title'}, 'Quien acompaña: ¿se entendió la palabra?'),
    el('div',{class:'oral-note'}, 'Intentarlo ya es participar. El reconocimiento automático puede equivocarse, y una palabra puede entenderse bien aunque no suene igual al modelo.')
  ]);
  if(p.oralTrackExact){
    evalBox.appendChild(el('div',{class:'oral-note'}, 'Exactitud respecto del modelo (opcional, para profesionales):'));
    evalBox.appendChild(el('div',{class:'grid-size-options', style:'margin-bottom:10px;'}, [
      {id:'approx', label:'〰️ Aproximada'}, {id:'exact', label:'✅ Igual al modelo'}
    ].map(o=> el('button',{class:'chip-option'+(exact===o.id?' selected':''), onclick:()=>{ state.practice.exact = (exact===o.id)?null:o.id; render(); }}, o.label))));
  }
  evalBox.appendChild(el('div',{class:'manual-check', style:'justify-content:flex-start;'},[
    el('button',{class:'pill-btn solid scan-item', 'data-scan-label':'Se entendió', onclick: async ()=>{
      p.progress.oralAttempts = (p.progress.oralAttempts||0) + 1;
      p.progress.oralUnderstood = (p.progress.oralUnderstood||0) + 1;
      if(p.oralTrackExact && state.practice.exact==='exact') p.progress.oralExact = (p.progress.oralExact||0) + 1;
      registerStreak(p, true);
      setMascotMood(p,'good',{speak:true, delayMs:500});
      await afterProgressUpdate(p); startSayPractice();
    }}, '✅ Se entendió'),
    el('button',{class:'pill-btn scan-item', 'data-scan-label':'Probar otra vez', onclick: async ()=>{
      p.progress.oralAttempts = (p.progress.oralAttempts||0) + 1;
      await saveProfile(p);
      if(state.practice.recordingUrl) URL.revokeObjectURL(state.practice.recordingUrl);
      state.practice.recordingUrl = null; state.practice.autoNote = ''; state.practice.feedback = null; state.practice.exact = null;
      render();
    }}, '🔁 Probar otra vez'),
    el('button',{class:'pill-btn scan-item', 'data-scan-label':'Otra palabra', onclick:()=>startSayPractice()}, '⏭ Otra palabra (sin registrar)')
  ]));
  wrap.appendChild(evalBox);

  wrap.appendChild(el('div',{class:'helper-note'}, '🎓 Este modo es opcional y no es el único camino: una persona puede comunicarse muy bien con pictogramas o mensajes de voz sintetizada sin practicar pronunciación. Las grabaciones no se guardan; solo se registra el intento.'));
  return wrap;
}

// -------- Armar la frase (secuenciación) --------
async function startSequencePractice(){
  const p = await loadProfile(state.currentId);
  const pools = categorizedPools(p);
  const hasCat = c => pools[c] && pools[c].length>0;
  const hasWord = w => !!findWordByLabel(p, w);
  const AUX_VERBS = ['querer','necesito','tengo','estoy'];
  const pick = c => { let arr = pools[c]; if(c==='acciones') arr = arr.filter(w=>!AUX_VERBS.includes(normalizeWord(w.label))); return arr[Math.floor(Math.random()*arr.length)]; };
  const fixed = w => findWordByLabel(p, w);
  // Plantillas armadas a mano para que las frases tengan sentido real (en vez de mezclar categorías al azar).
  // "cat" = una palabra cualquiera de esa categoría; "word" = una palabra fija (yo, querer, no, por favor).
  const TEMPLATES = [
    { len:2, need:['acciones'], build:()=>[fixed('yo'), pick('acciones')] },
    { len:2, need:['emociones'], build:()=>[fixed('yo'), pick('emociones')] },
    { len:2, need:['personas','emociones'], build:()=>[pick('personas'), pick('emociones')] },
    { len:3, need:['necesidades'], build:()=>[fixed('yo'), fixed('querer'), pick('necesidades')] },
    { len:3, need:['acciones'], build:()=>[fixed('yo'), fixed('querer'), pick('acciones')] },
    { len:3, need:['tema'], build:()=>[fixed('yo'), fixed('querer'), pick('tema')] },
    { len:4, need:['necesidades'], build:()=>[fixed('yo'), fixed('no'), fixed('querer'), pick('necesidades')] },
    { len:4, need:['necesidades'], build:()=>[fixed('yo'), fixed('querer'), pick('necesidades'), fixed('por favor')] },
  ];
  const usable = TEMPLATES.filter(t => t.need.every(hasCat) && ['yo','querer','no','por favor'].every(hasWord));
  if(usable.length===0){ alert('Activá al menos la categoría Necesidades o Acciones (y que Social esté activa, para "yo"/"querer") para practicar frases.'); return; }
  const targetLen = getSequenceLen(p);
  let candidates = usable.filter(t=>t.len===targetLen);
  if(candidates.length===0) candidates = usable.filter(t=>t.len===Math.min(...usable.map(t=>t.len)));
  const template = candidates[Math.floor(Math.random()*candidates.length)];
  const model = template.build();
  const shuffled = [...model].sort(()=>Math.random()-0.5);
  state.sequence = { model, pool:shuffled, built:[], done:false, mistakes:0 };
  state.practice.feedback = null;
  setMascotMood(null,'idle');
  state.view = 'practice-sequence'; render();
  setTimeout(()=>speakSentence(p, model), 250);
}

// -------- Rompecabezas didáctico --------
async function startPuzzlePractice(resetSession){
  const p = await loadProfile(state.currentId);
  const pool = collectAllWordsForPractice(p);
  if(pool.length < 1){ alert('Activá al menos una palabra en la configuración para poder jugar.'); return; }
  if(state.puzzle && state.puzzle.autoTimeoutId){ clearTimeout(state.puzzle.autoTimeoutId); }
  const sessionCount = (resetSession===false && state.puzzle) ? (state.puzzle.sessionCount||0) : 0;
  const word = pool[Math.floor(Math.random()*pool.length)];
  const size = getPuzzleSize(p);
  const pieces = [];
  for(let r=0;r<size;r++) for(let c=0;c<size;c++) pieces.push({ id:r*size+c, row:r, col:c });
  const tray = [...pieces].sort(()=>Math.random()-0.5);
  state.puzzle = { word, size, tray, slots: new Array(size*size).fill(null), selectedPieceId:null, wrongSlotIndex:null, done:false, sessionCount, autoTimeoutId:null };
  state.practice.feedback = null;
  setMascotMood(null,'idle');
  state.view = 'practice-puzzle';
  render();
}
async function renderPuzzlePractice(){
  const p = await loadProfile(state.currentId);
  const { word, size, tray, slots, selectedPieceId, wrongSlotIndex, done, sessionCount } = state.puzzle;
  const FRAME_PX = 240;
  const cell = FRAME_PX / size;
  const wrap = el('div',{class:'practice-wrap'});

  wrap.appendChild(el('div',{class:'practice-prompt'},[
    levelBadge(p, size+'×'+size+' piezas'),
    el('div',{class:'section-sub'},'🖼️ Tocá una pieza y después el lugar del dibujo donde va'),
    el('div',{class:'muted', style:'font-size:13px; margin:2px 0 10px;'}, `Rompecabezas resueltos en esta sesión: ${sessionCount}`),
    el('button',{class:'say-btn scan-item', onclick:()=>speakItem(p, word)},[el('span',{},'👂 '),'Escuchar una pista'])
  ]));
  wrap.appendChild(feedbackBanner(state.practice.feedback));

  const puzzleWrap = el('div',{class:'puzzle-wrap'});
  const frame = el('div',{class:'puzzle-frame', style:`grid-template-columns:repeat(${size},${cell}px); grid-template-rows:repeat(${size},${cell}px); width:${FRAME_PX}px; height:${FRAME_PX}px;`});
  for(let i=0;i<slots.length;i++){
    const occupied = slots[i];
    const row = Math.floor(i/size), col = i%size;
    let cls = 'puzzle-slot'+(occupied?'':' empty scan-item')+(wrongSlotIndex===i?' wrong-flash':'');
    let inner = null;
    if(occupied){
      inner = puzzlePieceVisual(word, cell, FRAME_PX, occupied.row, occupied.col);
    }
    frame.appendChild(el('button',{class:cls, style:`width:${cell}px;height:${cell}px;`, onclick: async ()=>{
      if(done || slots[i]) return;
      if(selectedPieceId==null) return;
      const piece = tray.find(pc=>pc.id===selectedPieceId);
      if(!piece) return;
      markInteraction();
      p.progress.practiceAttempts += 1;
      if(piece.row===row && piece.col===col){
        slots[i] = piece;
        state.puzzle.tray = tray.filter(pc=>pc.id!==piece.id);
        state.puzzle.selectedPieceId = null;
        state.practice.feedback = null;
        p.progress.practiceCorrect += 1;
        registerStreak(p, true);
        hapticFeedback(p, 'good');
        if(slots.every(s=>s)){
          state.puzzle.done = true;
          state.puzzle.sessionCount = (state.puzzle.sessionCount||0)+1;
          p.progress.puzzlesCompleted = (p.progress.puzzlesCompleted||0)+1;
          setMascotMood(p,'good',{speak:true, delayMs:1200});
          await afterProgressUpdate(p);
          setTimeout(()=>speakItem(p, word), 400);
          state.puzzle.autoTimeoutId = setTimeout(()=>startPuzzlePractice(false), 3200);
        }else{
          await afterProgressUpdate(p);
        }
      }else{
        state.practice.feedback = {type:'wrong-slot'};
        state.puzzle.wrongSlotIndex = i;
        registerStreak(p, false);
        hapticFeedback(p, 'bad');
        setMascotMood(p,'bad',{speak:true, delayMs:500});
        await afterProgressUpdate(p);
        setTimeout(()=>{ state.puzzle.wrongSlotIndex=null; state.practice.feedback=null; render(); }, 900);
      }
      render();
    }}, inner));
  }
  puzzleWrap.appendChild(frame);

  if(!done){
    const trayEl = el('div',{class:'puzzle-tray'});
    tray.forEach(piece=>{
      const selected = selectedPieceId===piece.id;
      const pieceBg = puzzlePieceVisual(word, cell, FRAME_PX, piece.row, piece.col);
      trayEl.appendChild(el('button',{class:'puzzle-piece'+(selected?' selected':'')+' scan-item', 'data-scan-label':word.label, style:`width:${cell}px;height:${cell}px;`, onclick:()=>{
        state.puzzle.selectedPieceId = selected ? null : piece.id;
        render();
      }}, pieceBg));
    });
    puzzleWrap.appendChild(trayEl);
    puzzleWrap.appendChild(el('div',{class:'sentence-actions', style:'justify-content:center; margin-top:6px;'},[
      el('button',{class:'round-action back scan-item', onclick:()=>{ if(state.puzzle.autoTimeoutId) clearTimeout(state.puzzle.autoTimeoutId); state.view='practice-menu'; render(); }}, '🏁 Terminar sesión')
    ]));
  }else{
    puzzleWrap.appendChild(el('div',{class:'feedback-banner good'}, `¡Armaste el dibujo! Es: ${word.label} 🎉`));
    puzzleWrap.appendChild(el('div',{class:'muted', style:'font-size:13px; margin-bottom:8px;'}, 'El próximo rompecabezas empieza solo en unos segundos…'));
    puzzleWrap.appendChild(el('div',{class:'sentence-actions', style:'justify-content:center;'},[
      el('button',{class:'round-action speak scan-item', onclick:()=>speakItem(p, word)}, '🔊 Escuchar de nuevo'),
      el('button',{class:'round-action back scan-item', onclick:()=>{ if(state.puzzle.autoTimeoutId) clearTimeout(state.puzzle.autoTimeoutId); startPuzzlePractice(false); }}, '➡️ Ahora'),
      el('button',{class:'round-action back scan-item', onclick:()=>{ if(state.puzzle.autoTimeoutId) clearTimeout(state.puzzle.autoTimeoutId); state.view='practice-menu'; render(); }}, '🏁 Terminar sesión')
    ]));
  }
  wrap.appendChild(puzzleWrap);
  wrap.appendChild(el('div',{class:'helper-note'}, '🎓 Trabaja percepción visual y atención. Si una pieza no entra en el lugar elegido, se marca en rojo y podés intentar en otro lugar — la palabra se revela como premio al terminar.'));
  return wrap;
}

// -------- Juego de globos --------
const BALLOON_COLORS = ['#FF6B81','#4DA6E8','#FFC93C','#6BCB77','#B57BDC','#FF9F45','#4ECDC4'];
async function startBalloonsPractice(resetSession){
  const p = await loadProfile(state.currentId);
  const pool = collectAllWordsForPractice(p);
  if(pool.length < 2){ alert('Activá al menos 2 palabras en la configuración para poder jugar.'); return; }
  if(state.balloonGame && state.balloonGame.autoTimeoutId) clearTimeout(state.balloonGame.autoTimeoutId);
  const sessionCount = (resetSession===false && state.balloonGame) ? (state.balloonGame.sessionCount||0) : 0;
  const nOptions = Math.min(getOptionsCount(p), pool.length);
  const target = pool[Math.floor(Math.random()*pool.length)];
  const distractors = pool.filter(w=>w.label!==target.label).sort(()=>Math.random()-0.5).slice(0, Math.max(1,nOptions-1));
  const options = [target, ...distractors].sort(()=>Math.random()-0.5);
  state.practice = { target, options, locked:false, feedback:null };
  state.balloonGame = { sessionCount, autoTimeoutId:null };
  setMascotMood(null,'idle');
  state.view = 'practice-balloons';
  render();
  setTimeout(()=>speakItem(p, target), 200);
}
async function resolveBalloon(p, target, isTarget){
  state.practice.locked = true;
  markInteraction();
  p.progress.practiceAttempts += 1;
  registerStreak(p, isTarget);
  p.progress.compAttempts = (p.progress.compAttempts||0) + 1; if(isTarget) p.progress.compCorrect = (p.progress.compCorrect||0) + 1;
  hapticFeedback(p, isTarget?'good':'bad');
  if(isTarget){
    state.practice.feedback='good'; setMascotMood(p,'good',{speak:true, delayMs:1500}); p.progress.practiceCorrect += 1;
    p.progress.balloonsPopped = (p.progress.balloonsPopped||0)+1;
    state.balloonGame.sessionCount = (state.balloonGame.sessionCount||0)+1;
    speak('¡Muy bien! '+target.label, p.voiceRate, p.voicePitch);
  }else{
    state.practice.feedback = {type:'bad', correct:target}; setMascotMood(p,'bad',{speak:true, delayMs:1900});
    speak('No es esa. La correcta es: '+target.label, p.voiceRate, p.voicePitch);
  }
  await afterProgressUpdate(p); render();
  state.balloonGame.autoTimeoutId = setTimeout(()=>startBalloonsPractice(false), 2400);
}

// -------- Memotest (imagen ↔ palabra) --------
async function startMemotest(resetSession){
  const p = await loadProfile(state.currentId);
  const pool = collectAllWordsForPractice(p);
  const seenL = new Set(), seenE = new Set();
  const uniq = pool.filter(w=>{ const l=normalizeWord(w.label); if(seenL.has(l)||seenE.has(w.emoji)) return false; seenL.add(l); seenE.add(w.emoji); return true; });
  if(uniq.length < 3){ alert('Activá al menos 3 palabras distintas en la configuración para poder jugar al memotest.'); return; }
  if(state.memo && state.memo.autoTimeoutId) clearTimeout(state.memo.autoTimeoutId);
  const sessionCount = (resetSession===false && state.memo) ? (state.memo.sessionCount||0) : 0;
  const pairs = Math.min(uniq.length, Math.min(8, getOptionsCount(p)+1));
  const chosen = [...uniq].sort(()=>Math.random()-0.5).slice(0, pairs);
  const cards = [];
  chosen.forEach((w,i)=>{ cards.push({ id:'p'+i, pair:i, kind:'pic', word:w }); cards.push({ id:'w'+i, pair:i, kind:'word', word:w }); });
  cards.sort(()=>Math.random()-0.5);
  state.memo = { cards, flipped:[], matchedPairs:[], pairs, locked:false, done:false, sessionCount, autoTimeoutId:null };
  state.practice.feedback = null;
  setMascotMood(null,'idle');
  state.view = 'practice-memotest';
  render();
}
async function renderMemotest(){
  const p = await loadProfile(state.currentId);
  const m = state.memo;
  const wrap = el('div',{class:'practice-wrap'});
  wrap.appendChild(el('div',{class:'practice-prompt'},[
    levelBadge(p, m.pairs+' parejas'),
    el('div',{class:'section-sub'},'🃏 Da vuelta dos cartas: buscá cada imagen con su palabra'),
    el('div',{class:'muted', style:'font-size:13px;'}, `Memotests completados en esta sesión: ${m.sessionCount}`)
  ]));
  wrap.appendChild(feedbackBanner(state.practice.feedback));
  const grid = el('div',{class:'memo-grid'});
  m.cards.forEach(card=>{
    const isMatched = m.matchedPairs.includes(card.pair);
    const isUp = isMatched || m.flipped.includes(card.id);
    const face = !isUp ? el('span',{class:'mback'},'❓')
      : (card.kind==='pic' ? symbolEl(card.word) : el('span',{class:'mlabel'}, card.word.label));
    grid.appendChild(el('button',{class:'memo-card'+(isUp?' up':'')+(isMatched?' matched':'')+' scan-item', disabled: (m.locked || isUp || m.done), onclick: async (ev)=>{
      if(m.locked || m.done || isUp || m.flipped.length>=2) return;
      markInteraction();
      m.flipped.push(card.id);
      speakItem(p, card.word);
      if(m.flipped.length<2){ render(); return; }
      m.locked = true;
      const [a,b] = m.flipped.map(id=>m.cards.find(c=>c.id===id));
      p.progress.practiceAttempts += 1;
      if(a.pair===b.pair){
        m.matchedPairs.push(a.pair); m.flipped = [];
        p.progress.practiceCorrect += 1;
        state.practice.feedback = 'good';
        registerStreak(p, true);
        hapticFeedback(p, 'good');
        sparkAt(ev.currentTarget, p);
        if(m.matchedPairs.length===m.pairs){
          m.done = true;
          m.sessionCount = (m.sessionCount||0)+1;
          p.progress.memotestsCompleted = (p.progress.memotestsCompleted||0)+1;
          setMascotMood(p,'good',{speak:true, delayMs:1500});
          m.autoTimeoutId = setTimeout(()=>startMemotest(false), 4200);
        }
        m.locked = false;
        await afterProgressUpdate(p);
        render();
      }else{
        state.practice.feedback = { type:'memo-miss', a, b };
        registerStreak(p, false);
        hapticFeedback(p, 'bad');
        await afterProgressUpdate(p);
        render();
        setTimeout(()=>{ m.flipped = []; m.locked = false; state.practice.feedback = null; render(); }, 1500);
      }
    }},[ face ]));
  });
  wrap.appendChild(grid);
  if(m.done){
    wrap.appendChild(el('div',{class:'feedback-banner good'}, '¡Encontraste todas las parejas! 🎉'));
    wrap.appendChild(el('div',{class:'muted', style:'font-size:13px; margin-bottom:8px;'}, 'El próximo memotest empieza solo en unos segundos…'));
    wrap.appendChild(el('div',{class:'sentence-actions', style:'justify-content:center;'},[
      el('button',{class:'round-action back scan-item', onclick:()=>{ if(m.autoTimeoutId) clearTimeout(m.autoTimeoutId); startMemotest(false); }}, '➡️ Ahora'),
      el('button',{class:'round-action back scan-item', onclick:()=>{ if(m.autoTimeoutId) clearTimeout(m.autoTimeoutId); state.view='practice-menu'; render(); }}, '🏁 Terminar sesión')
    ]));
  }else{
    wrap.appendChild(el('div',{class:'sentence-actions', style:'justify-content:center;'},[
      el('button',{class:'round-action back scan-item', onclick:()=>{ state.view='practice-menu'; render(); }}, '🏁 Terminar')
    ]));
  }
  wrap.appendChild(el('div',{class:'helper-note'}, '🎓 Trabaja memoria de trabajo y la asociación entre la imagen y la palabra escrita. Cada carta que se da vuelta dice su palabra en voz alta. Con dificultad automática, suma parejas a medida que acierta.'));
  return wrap;
}

function startStory(storyId){
  markInteraction();
  state.story = { storyId, sceneIndex:0, sentence:[] };
  setMascotMood(null,'idle');
  state.view = 'story-play';
  render();
}
async function renderStoryMenu(){

  wrap.appendChild(el('div',{class:'card'},[
    el('div',{class:'section-title'},'📖 Historias interactivas'),
    el('div',{class:'section-sub'},'Situaciones de la vida real donde el niño va eligiendo qué decir en cada paso. Trabaja lenguaje funcional en contexto, no solo palabras sueltas.')
  ]));
  const grid = el('div',{class:'story-grid'});
  STORIES.forEach(s=>{
    grid.appendChild(el('div',{class:'story-card'},[
      el('span',{class:'s-emoji'}, s.emoji), el('h3',{}, s.title), el('p',{}, s.desc),
      el('button',{class:'pill-btn solid scan-item', 'data-scan-label':'Comenzar '+s.title, onclick:()=>startStory(s.id)}, 'Comenzar')
    ]));
  });
  wrap.appendChild(grid);

async function renderStoryPlay(){
  const p = await loadProfile(state.currentId);
  const story = STORIES.find(s=>s.id===state.story.storyId);
  const { sceneIndex, sentence } = state.story;
  const wrap = el('div',{class:'practice-wrap'});
  wrap.appendChild(el('div',{class:'section-sub', style:'margin-bottom:10px;'}, story.emoji+' '+story.title));

  const sentStrip = el('div',{class:'story-sentence'});
  if(sentence.length===0) sentStrip.appendChild(el('span',{class:'empty-hint'},'Tu historia va a aparecer acá…'));
  else sentence.forEach(w=> sentStrip.appendChild(el('div',{class:'sentence-word'},[el('span',{class:'emoji'},w.emoji), el('span',{},w.label)])));
  wrap.appendChild(sentStrip);

  if(sceneIndex < story.scenes.length){
    const scene = story.scenes[sceneIndex];
    wrap.appendChild(el('div',{class:'story-scene'},[
      el('span',{class:'s-emoji'}, scene.promptEmoji),
      el('div',{class:'s-text'}, scene.prompt)
    ]));
    const optGrid = el('div',{class:'story-options'});
    scene.options.forEach(opt=>{
      optGrid.appendChild(el('button',{class:'story-option scan-item', 'data-scan-label':opt.label, onclick: async (ev)=>{
        markInteraction();
        state.story.sentence.push(opt);
        hapticFeedback(p, 'good');
        sparkAt(ev.currentTarget, p);
        mascotWordReaction(opt.label);
        speakItem(p, opt);
        state.story.sceneIndex += 1;
        p.progress.wordsSpoken += 1;
        if(state.story.sceneIndex>=story.scenes.length) p.progress.sentencesBuilt += 1;
        await afterProgressUpdate(p); render();
      }},[ symbolEl(opt), el('span',{class:'label'}, opt.label) ]));
    });
    wrap.appendChild(optGrid);
  }else{
    wrap.appendChild(el('div',{class:'story-scene'},[
      el('span',{class:'s-emoji'},'🎉'),
      el('div',{class:'s-text'}, story.ending)
    ]));
    wrap.appendChild(el('div',{class:'sentence-actions', style:'justify-content:center;'},[
      el('button',{class:'round-action speak scan-item', onclick:()=>speakSentence(p, sentence)}, '🔊 Escuchar toda la historia'),
      el('button',{class:'round-action back scan-item', onclick:()=>startStory(story.id)}, '🔁 De nuevo'),
      el('button',{class:'round-action back scan-item', onclick:()=>{state.view='story-menu'; render();}}, '📖 Otra historia')
    ]));
  }
  wrap.appendChild(el('div',{class:'helper-note'}, '🎓 Cada elección construye una frase con sentido dentro de una situación real, para practicar comunicación funcional más allá de palabras sueltas.'));
  return wrap;
}

// Gesto automático de la mascota cada pocos segundos, para que nunca se vea quieta.
// Actúa directo sobre el elemento en pantalla (sin llamar a render()), así nunca corta
// lo que el usuario esté escribiendo en otra parte de la app en ese momento.
(function scheduleMascotFlourish(){
  const pNow = state.currentId ? state.profilesCache[state.currentId] : null;
  const altoNow = !!(pNow && pNow.sensoryEffects!==false && pNow.sensoryIntensity==='alto');
  // En modo ALTO la mascota es hiperactiva (cada 2-4 s); en normal, cada 5-9 s.
  const wait = altoNow ? 2500 + Math.random()*1800 : 5000 + Math.random()*4000;
  setTimeout(()=>{
    const p = state.currentId ? state.profilesCache[state.currentId] : null;
    const avatar = document.querySelector('.mascot-avatar');
    const calm = !!(p && p.sensoryEffects===false);
    const alto = !!(p && !calm && p.sensoryIntensity==='alto');
    const busyWithMascot = state.mascotDragging || (Date.now()-mascotLastTouchAt) < 8000;
    if(avatar && !calm && !busyWithMascot){
      if(!avatar.classList.contains('mascot-poke')){
        avatar.classList.add('mascot-flourish');
        setTimeout(()=>avatar.classList.remove('mascot-flourish'), 900);
      }
      // Cambia de lugar en la pantalla (no se queda fija en un rincón).
      if(state.currentId && Math.random() < (alto ? 0.9 : 0.7)){ roamMascot(); }
      // De vez en cuando comenta algo por su cuenta, hablado (y a veces llamando al niño/a por su nombre).
      if(p && state.mascotMood==='idle' && Math.random() < (alto ? 0.45 : 0.3)){
        setMascotMood(p,'idle',{speak:true}); render();
      }
    }
    // Si pasó bastante tiempo sin que el niño toque nada, la mascota invita a seguir jugando (una vez por período de inactividad).
    if(avatar && !state.idleNudged && (Date.now()-lastInteractionAt) > 45000 && state.currentId){
      if(p){ state.idleNudged = true; const nm = firstName(p.name); speak(nm ? '¿Querés probar otro juego, '+nm+'? 🎮' : MASCOT_NUDGE, p.voiceRate, p.voicePitch); }
    }
    scheduleMascotFlourish();
  }, wait);
})();
