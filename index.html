const ACT_LABELS = { 'practice-listen':'👂 Escuchar y elegir', 'practice-read':'👀 Leer y elegir', 'practice-say':'🗣️ Repetir en voz alta',
  'practice-sequence':'🧩 Armar la frase', 'practice-puzzle':'🖼️ Rompecabezas', 'practice-balloons':'🎈 Globos', 'practice-memotest':'🃏 Memotest',
  'practice-story':'📖 Historias', 'board':'🗣️ Tablero de comunicación', 'messages':'💬 Mis mensajes' };
function launchActivity(id){
  markInteraction();
  if(id!=='board' && id!=='messages') bumpActivity(id);
  if(id==='board'){ state.view='board'; render(); }
  else if(id==='messages'){ state.view='messages'; render(); }
  else if(id==='practice-sequence') startSequencePractice();
  else if(id==='practice-say') startSayPractice();
  else if(id==='practice-puzzle') startPuzzlePractice();
  else if(id==='practice-balloons') startBalloonsPractice();
  else if(id==='practice-story'){ state.view='story-menu'; render(); }
  else if(id==='practice-memotest') startMemotest();
  else startSimplePractice(id);
}
async function renderMessagesView(){
  const p = await loadProfile(state.currentId);
  if(!Array.isArray(p.messages)) p.messages = defaultMessages();
  const all = p.messages;
  const wrap = el('div',{});
  if(state.recordingWord) wrap.appendChild(await renderVoiceRecorderPanel(p, state.recordingWord));
  const edit = !!state.messagesEdit;
  wrap.appendChild(el('div',{class:'card'},[
    el('div',{class:'section-title'},'💬 Mis mensajes'),
    el('div',{class:'section-sub'}, edit
      ? 'Modo edición: cambiá el texto, el orden y el grupo de cada mensaje, elegí cuáles quedan fijados arriba del tablero (📌) y grabá tu propia voz (🎙️).'
      : 'Tocá un mensaje para decirlo completo, con un solo toque. Los fijados (📌) también aparecen siempre arriba del tablero.'),
    el('div',{class:'sentence-tools'},[
      el('button',{class:'pill-btn'+(edit?' solid':''), onclick:()=>{ state.messagesEdit = !edit; render(); }}, edit ? '✔ Terminar de editar' : '✏️ Editar mis mensajes'),
      el('button',{class:'pill-btn'+(msgViewMode(p)==='visual'?' solid':''), title:'Mostrar cada mensaje con un pictograma por palabra', onclick:async()=>{ p.messageView='visual'; await saveProfile(p); render(); }}, '🖼️ Con pictogramas'),
      el('button',{class:'pill-btn'+(msgViewMode(p)==='text'?' solid':''), title:'Mostrar solo el emoji y el texto', onclick:async()=>{ p.messageView='text'; await saveProfile(p); render(); }}, '🔤 Solo texto')
    ])
  ]));
  if(isAdultMode(p) || edit) wrap.appendChild(messagePackRow(p));
  const filt = el('div',{class:'theme-options', style:'margin:14px 0;'});
  [{id:'all',label:'Todos',emoji:'📋'}, ...messageGroupsFor(p)].forEach(g=>{
    filt.appendChild(el('button',{class:'chip-option'+(state.messagesGroup===g.id?' selected':'')+(edit?'':' scan-item'), 'data-scan-label':g.label,
      onclick:()=>{ state.messagesGroup = g.id; render(); }}, g.emoji+' '+g.label));
  });
  wrap.appendChild(filt);
  const visible = all.filter(m=> state.messagesGroup==='all' || m.group===state.messagesGroup);
  if(!edit){
    const visualMode = msgViewMode(p) === 'visual';
    const grid = el('div',{class: visualMode ? 'msg-grid' : 'quick-grid'});
    visible.forEach(m=>{
      if(visualMode){
        const col = MSG_GROUP_COLORS[m.group] || '#6E5DE0';
        grid.appendChild(el('button',{class:'msg-card scan-item', style:'--mc:'+col, 'data-scan-label':m.text, onclick:(ev)=>useMessage(p, m, ev.currentTarget)}, [ messageVisualEl(p, m) ]));
      }else{
        grid.appendChild(el('button',{class:'quick-btn scan-item', 'data-scan-label':m.text, onclick:(ev)=>useMessage(p, m, ev.currentTarget)},[
          el('span',{class:'emoji'}, m.emoji), el('span',{class:'label'}, m.text) ]));
      }
    });
    if(!visible.length) grid.appendChild(el('div',{class:'muted'}, 'No hay mensajes en este grupo. Tocá "Editar mis mensajes" para agregar.'));
    wrap.appendChild(grid);
  }else{
    const idx = await ensureVoiceIndex(p.id);
    visible.forEach((m,vi)=>{
      const gi = all.indexOf(m);
      const move = (dir)=>{ const other = visible[vi+dir]; if(!other) return; const oi = all.indexOf(other); [all[gi], all[oi]] = [all[oi], all[gi]]; saveProfile(p).then(()=>render()); };
      wrap.appendChild(el('div',{class:'msg-edit-card'},[
        messageVisualEl(p, m, {compact:true}),
        el('div',{class:'m-text'}, m.text + (idx.has(normalizeWord(m.text)) ? '  🎙️' : '') + (m.pinned ? '  📌' : '')),
        el('select',{onchange:(e)=>{ m.group = e.target.value; saveProfile(p).then(()=>render()); }},
          messageGroupsFor(p).map(g=> el('option',{value:g.id, ...(g.id===m.group?{selected:'selected'}:{})}, g.label))),
        el('div',{class:'msg-edit-actions'},[
          el('button',{class:'mini-btn', disabled: vi===0, title:'Subir', onclick:()=>move(-1)}, '▲'),
          el('button',{class:'mini-btn', disabled: vi===visible.length-1, title:'Bajar', onclick:()=>move(1)}, '▼'),
          el('button',{class:'mini-btn', title:'Fijar o soltar en el tablero', onclick:()=>{ m.pinned = !m.pinned; saveProfile(p).then(()=>render()); }}, m.pinned ? '📌 Fijado' : '📍 Fijar'),
          el('button',{class:'mini-btn', title:'Cambiar texto', onclick:()=>{
            const t = prompt('Texto del mensaje', m.text);
            if(t && t.trim()){
              m.text = t.trim();
              const e2 = prompt('Emoji del mensaje (uno solo)', m.emoji);
              if(e2 && e2.trim()) m.emoji = Array.from(e2.trim()).slice(0,2).join('');
              saveProfile(p).then(()=>render());
            }
          }}, '✏️'),
          el('button',{class:'mini-btn', title:'Imagen de la frase (foto o pictograma)', onclick:()=>openMessageImageModal(p, m, ()=>render())}, '🖼️'),
          el('button',{class:'mini-btn', title:'Grabar mi voz', onclick: async ()=>{
            state.recordingWord = { label:m.text, emoji:m.emoji };
            state.wordRecorder = { recording:false, mediaRecorder:null, previewDataUri:null, existingDataUri:null };
            render();
            try{
              const res = await Storage.get('voice-clip:'+p.id+':'+normalizeWord(m.text));
              if(res && res.value){ state.wordRecorder.existingDataUri = res.value; render(); }
            }catch(e){}
          }}, '🎙️'),
          el('button',{class:'mini-btn', title:'Borrar', onclick:()=>{
            if(!confirm('¿Borrar el mensaje "'+m.text+'"?')) return;
            p.messages = all.filter(x=>x!==m); saveProfile(p).then(()=>render());
          }}, '🗑')
        ])
      ]));
    });
    const draft = { emoji:'💬', text:'', group: state.messagesGroup!=='all' ? state.messagesGroup : 'pedir' };
    wrap.appendChild(el('div',{class:'card', style:'margin-top:16px;'},[
      el('div',{class:'section-title'},'Agregar un mensaje'),
      el('div',{class:'custom-word-form'},[
        el('div',{class:'field', style:'max-width:90px;'},[ el('label',{},'Emoji'), el('input',{type:'text', maxlength:'4', value:draft.emoji, oninput:e=>draft.emoji=e.target.value}) ]),
        el('div',{class:'field', style:'flex:3; min-width:200px;'},[ el('label',{},'Mensaje'), el('input',{type:'text', placeholder:'ej: Quiero llamar a mamá', oninput:e=>draft.text=e.target.value}) ]),
        el('div',{class:'field'},[ el('label',{},'Grupo'), el('select',{onchange:e=>draft.group=e.target.value},
          messageGroupsFor(p).map(g=> el('option',{value:g.id, ...(g.id===draft.group?{selected:'selected'}:{})}, g.label))) ]),
        el('button',{class:'pill-btn solid', onclick: async ()=>{
          const t = draft.text.trim(); if(!t) return;
          all.push({ id:'m'+Date.now(), text:t, emoji:(draft.emoji||'💬'), group:draft.group, pinned:false });
          p.messages = all; await saveProfile(p); render();
        }}, '+ Agregar')
      ]),
      el('div',{class:'save-bar', style:'justify-content:flex-start;'},[
        el('button',{class:'pill-btn warn', onclick: async ()=>{
          if(!confirm('¿Volver a los mensajes predeterminados? Se pierden los cambios que hiciste en esta lista.')) return;
          p.messages = defaultMessages(); await saveProfile(p); render();
        }}, '↺ Restaurar mensajes predeterminados')
      ])
    ]));
  }
  wrap.appendChild(el('div',{class:'helper-note'}, '💡 Los mensajes se pueden decir con la voz de la aplicación o con una grabación propia: una voz conocida suele entenderse mejor en el entorno habitual de la persona. Si cambiás el texto de un mensaje, hay que volver a grabarlo.'));
  return wrap;
}

async function renderPathView(){
  const p = await loadProfile(state.currentId);
  const counts = (p.progress && p.progress.activityCounts) || {};
  const focus = new Set(p.pathFocus || []);
  const wrap = el('div',{});
  wrap.appendChild(el('div',{class:'card'},[
    el('div',{class:'section-title'},'🧭 Ruta de aprendizaje'),
    el('div',{class:'section-sub'},'Un camino sugerido, no una escalera obligatoria. Se puede usar cualquier actividad en cualquier momento. Marcá con ⭐ los niveles que son objetivo por ahora. Una persona puede comprender mucho y no usar el habla oral, o practicar frases funcionales sin ejercicios de pronunciación: es totalmente válido. El tablero de comunicación está disponible en todos los niveles.'),
    el('div',{class:'sentence-tools'},[
      el('button',{class:'pill-btn solid scan-item', 'data-scan-label':'Ir al tablero', onclick:()=>launchActivity('board')}, '🗣️ Ir al tablero de comunicación'),
      el('button',{class:'pill-btn scan-item', 'data-scan-label':'Mis mensajes', onclick:()=>launchActivity('messages')}, '💬 Mis mensajes'),
      el('button',{class:'pill-btn scan-item', 'data-scan-label':'Niveles AAC', onclick:()=>{ state.view='levels'; render(); }}, '🪜 Niveles AAC')
    ])
  ]));
  LEARNING_LEVELS.forEach(lv=>{
    const isFocus = focus.has(lv.n);
    const card = el('div',{class:'level-card'+(isFocus?' focus':'')});
    card.appendChild(el('h3',{}, lv.emoji+' Nivel '+lv.n+' · '+lv.title+(isFocus?'  ⭐ Objetivo actual':'')));
    card.appendChild(el('p',{class:'muted', style:'margin:4px 0 0;'}, lv.desc));
    if(lv.soon) card.appendChild(el('div',{class:'helper-note'}, '🛠️ En preparación: este nivel todavía no tiene juegos propios en la aplicación.'));
    if(lv.acts.length){
      const row = el('div',{class:'level-acts'});
      lv.acts.forEach(id=>{
        const n = counts[id]||0;
        row.appendChild(el('button',{class:'pill-btn scan-item', 'data-scan-label':(ACT_LABELS[id]||id), onclick:()=>launchActivity(id)},
          (ACT_LABELS[id]||id) + (n ? '  ·  '+n+(n===1?' vez':' veces') : '')));
      });
      card.appendChild(row);
    }
    card.appendChild(el('div',{class:'sentence-tools', style:'margin-top:12px;'},[
      el('button',{class:'mini-btn', onclick: async ()=>{
        const cur = new Set(p.pathFocus||[]);
        if(cur.has(lv.n)) cur.delete(lv.n); else cur.add(lv.n);
        p.pathFocus = Array.from(cur).sort(); await saveProfile(p); render();
      }}, isFocus ? 'Quitar de objetivos' : '⭐ Marcar como objetivo')
    ]));
    wrap.appendChild(card);
  });
  return wrap;
}

const imgMem = {};      // imgMem[perfil] = { photo:{clave:dataURL}, arasaac:{clave:dataURL} }
const imgLoaded = {};
function imgSplit(ent){ const i = ent.indexOf('|'); return [ent.slice(0,i), ent.slice(i+1)]; }
async function ensureWordImages(pid){
  if(!pid) return { photo:{}, arasaac:{} };
  if(imgLoaded[pid]) return imgMem[pid];
  const mem = { photo:{}, arasaac:{} };
  try{
    const res = await Storage.get('word-img-index:'+pid);
    const idx = res && res.value ? JSON.parse(res.value) : [];
    await Promise.all(idx.map(async ent=>{
      const [type,key] = imgSplit(ent);
      if(!mem[type]) return;
      try{ const r = await Storage.get('word-img:'+pid+':'+type+':'+key); if(r && r.value) mem[type][key] = r.value; }catch(e){}
    }));
  }catch(e){}
  imgMem[pid] = mem; imgLoaded[pid] = true;
  return mem;
}
async function flushImageIndex(pid){
  const mem = imgMem[pid]; if(!mem) return;
  const list = [];
  ['photo','arasaac'].forEach(t=> Object.keys(mem[t]).forEach(k=> list.push(t+'|'+k)));
  try{ await Storage.set('word-img-index:'+pid, JSON.stringify(list)); }catch(e){}
}
async function saveWordImageKey(pid, type, key, dataUrl, skipIndex){
  const mem = await ensureWordImages(pid);
  if(!mem[type] || !key) return false;
  try{ await Storage.set('word-img:'+pid+':'+type+':'+key, dataUrl); }catch(e){ return false; }
  mem[type][key] = dataUrl;
  if(!skipIndex) await flushImageIndex(pid);
  return true;
}
function saveWordImage(pid, type, label, dataUrl, skipIndex){ return saveWordImageKey(pid, type, normalizeWord(label), dataUrl, skipIndex); }
async function deleteWordImage(pid, type, label){
  const mem = await ensureWordImages(pid), key = normalizeWord(label);
  delete mem[type][key];
  try{ await Storage.delete('word-img:'+pid+':'+type+':'+key); }catch(e){}
  await flushImageIndex(pid);
}
async function deleteAllWordImages(pid){
  try{
    const mem = await ensureWordImages(pid);
    for(const t of ['photo','arasaac']) for(const k of Object.keys(mem[t])){ try{ await Storage.delete('word-img:'+pid+':'+t+':'+k); }catch(e){} }
    try{ await Storage.delete('word-img-index:'+pid); }catch(e){}
  }catch(e){}
  delete imgMem[pid]; delete imgLoaded[pid];
}

function wordImageInfo(p, w){

// ----- Procesar archivos de imagen (se reducen para ahorrar espacio) -----
function loadImageEl(src, cors){
  return new Promise((res,rej)=>{
    const img = new Image(); if(cors) img.crossOrigin = 'anonymous';
    img.onload = ()=>res(img); img.onerror = ()=>rej(new Error('No se pudo leer la imagen'));
    img.src = src;
  });
}
function drawToDataUrl(img, kind){
  const nw = img.naturalWidth || img.width || 300, nh = img.naturalHeight || img.height || 300;
  if(kind==='photo'){
    const S = 360, c = document.createElement('canvas'); c.width = S; c.height = S;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,S,S);
    const sc = Math.min(S/nw, S/nh), w = nw*sc, h = nh*sc;
    ctx.drawImage(img, (S-w)/2, (S-h)/2, w, h);          // sin recortar: entra completa en un cuadrado
    return c.toDataURL('image/jpeg', 0.85);
  }
  const M = 300, sc = Math.min(1, M/Math.max(nw,nh)), w = Math.max(1,Math.round(nw*sc)), h = Math.max(1,Math.round(nh*sc));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  return c.toDataURL('image/png');
}
async function blobToSymbolDataUrl(blob, kind){
  const url = URL.createObjectURL(blob);
  try{ const img = await loadImageEl(url); return drawToDataUrl(img, kind); }
  finally{ URL.revokeObjectURL(url); }
}

// ----- ARASAAC (necesita internet SOLO para buscar y descargar; después queda guardado) -----
const ARASAAC_API = ['https://api.arasaac.org/v1', 'https://api.arasaac.org/api'];
const ARASAAC_CREDIT = 'Pictogramas: ARASAAC (https://arasaac.org), propiedad del Gobierno de Aragón, creados por Sergio Palao. Licencia CC BY-NC-SA 4.0: uso no comercial, con atribución y compartiendo igual.';
async function fetchJsonTimeout(url, ms){
  const ctl = new AbortController(), to = setTimeout(()=>ctl.abort(), ms||9000);
  try{ return await fetch(url, { signal: ctl.signal }); } finally{ clearTimeout(to); }
}
async function arasaacSearch(q, limit){
  const term = encodeURIComponent(String(q).trim());
  if(!term) return [];
  let lastErr = null, reached = false;
  for(const mode of ['bestsearch','search']){
    for(const base of ARASAAC_API){
      try{
        const r = await fetchJsonTimeout(`${base}/pictograms/es/${mode}/${term}`, 9000);
        reached = true;
        if(r.status===404){ break; }                      // sin resultados con este modo
        if(!r.ok){ lastErr = new Error('HTTP '+r.status); continue; }
        const arr = await r.json();
        if(Array.isArray(arr) && arr.length){
          return arr.slice(0, limit||24).map(x=>({ id:x._id, kw:(x.keywords||[]).map(k=>k.keyword).filter(Boolean) }));
        }
        break;
      }catch(e){ lastErr = e; }
    }
  }
  if(!reached && lastErr) throw lastErr;
  return [];
}
function arasaacThumbUrl(id){ return `https://static.arasaac.org/pictograms/${id}/${id}_300.png`; }
async function arasaacImageDataUrl(id){
  const urls = [ arasaacThumbUrl(id), `https://api.arasaac.org/v1/pictograms/${id}?download=false` ];
  let err = null;
  for(const u of urls){
    try{ const r = await fetchJsonTimeout(u, 12000); if(!r.ok) throw new Error('HTTP '+r.status); return await blobToSymbolDataUrl(await r.blob(), 'arasaac'); }catch(e){ err = e; }
    try{ const img = await loadImageEl(u, true); return drawToDataUrl(img, 'arasaac'); }catch(e){ err = e; }
  }
  throw err || new Error('No se pudo descargar');
}
function arasaacBest(results, label){
  const n = normalizeWord(label);
  return results.find(r=> r.kw.some(k=>normalizeWord(k)===n)) || results[0] || null;
}

// Descarga automáticamente un pictograma para cada palabra que todavía no tiene (elige el que mejor coincide).
const bulkState = { running:false, cancel:false, text:'' };
async function bulkArasaac(p, words, onProgress){
  bulkState.running = true; bulkState.cancel = false;
  let ok = 0, miss = 0, fail = 0, i = 0;
  const mem = await ensureWordImages(p.id);
  const todo = words.filter(w=> !mem.arasaac[normalizeWord(w.label)]);
  for(const w of todo){
    if(bulkState.cancel) break;
    i++; if(onProgress) onProgress(`Descargando ${i} de ${todo.length}: ${w.label}`);
    try{
      const res = await arasaacSearch(w.label, 8);
      const best = arasaacBest(res, w.label);
      if(!best){ miss++; continue; }
      const d = await arasaacImageDataUrl(best.id);
      if(await saveWordImage(p.id, 'arasaac', w.label, d, true)) ok++; else fail++;
    }catch(e){
      fail++;
      if(fail>=4 && ok===0){ bulkState.running = false; await flushImageIndex(p.id); throw new Error('sin conexión'); }
    }
    await new Promise(r=>setTimeout(r, 120));
  }
  await flushImageIndex(p.id);
  bulkState.running = false;
  return { ok, miss, fail, total: todo.length, cancelled: bulkState.cancel };
}

// ----- Importar imágenes sueltas o un ZIP (el nombre del archivo debe ser la palabra: agua.png, mamá.jpg…) -----
async function readZipImages(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  for(let i=buf.byteLength-22; i>=Math.max(0, buf.byteLength-65557); i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd = i; break; } }
  if(eocd<0) throw new Error('El archivo ZIP no es válido');
  const count = dv.getUint16(eocd+10,true); let pos = dv.getUint32(eocd+16,true);
  const out = [];
  for(let n=0;n<count;n++){
    if(dv.getUint32(pos,true)!==0x02014b50) break;
    const method = dv.getUint16(pos+10,true), csize = dv.getUint32(pos+20,true);
    const nlen = dv.getUint16(pos+28,true), elen = dv.getUint16(pos+30,true), clen = dv.getUint16(pos+32,true), lho = dv.getUint32(pos+42,true);
    const name = new TextDecoder().decode(u8.subarray(pos+46, pos+46+nlen));
    pos += 46+nlen+elen+clen;
    const m = name.match(/\.(png|jpe?g|webp|gif)$/i);
    if(!m || name.endsWith('/')) continue;
    const lnlen = dv.getUint16(lho+26,true), lelen = dv.getUint16(lho+28,true), start = lho+30+lnlen+lelen;
    const raw = u8.subarray(start, start+csize);
    let data;
    if(method===0) data = raw;
    else if(method===8){
      if(typeof DecompressionStream==='undefined') throw new Error('Este navegador no puede abrir ZIP comprimidos; descomprimí el archivo e importá las imágenes sueltas.');
      data = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    }else continue;
    const ext = m[1].toLowerCase();
    out.push({ name: name.split('/').pop(), blob: new Blob([data], {type: ext==='jpg'||ext==='jpeg' ? 'image/jpeg' : 'image/'+ext}) });
  }
  return out;
}
function fileNameToLabelKey(name){ return normalizeWord(name.replace(/\.[a-z0-9]+$/i,'').replace(/[_\-]+/g,' ').replace(/\s+/g,' ')); }
async function importImageFiles(p, fileList, type, onProgress){
  const vocab = allVocabWords(p), byKey = {};
  vocab.forEach(w=>{ byKey[normalizeWord(w.label)] = w; });
  const items = [];
  for(const f of Array.from(fileList)){
    if(/\.zip$/i.test(f.name)){ (await readZipImages(await f.arrayBuffer())).forEach(x=>items.push(x)); }
    else if(/^image\//.test(f.type) || /\.(png|jpe?g|webp|gif|svg)$/i.test(f.name)) items.push({ name:f.name, blob:f });
  }
  let ok = 0; const unmatched = [];
  for(let i=0;i<items.length;i++){
    const it = items[i], key = fileNameToLabelKey(it.name);
    if(onProgress) onProgress(`Procesando ${i+1} de ${items.length}`);
    const w = byKey[key];
    if(!w){ unmatched.push(it.name); continue; }
    try{ const d = await blobToSymbolDataUrl(it.blob, type); if(await saveWordImage(p.id, type, w.label, d, true)) ok++; }catch(e){ unmatched.push(it.name); }
  }
  await flushImageIndex(p.id);
  return { ok, unmatched, total: items.length };
}

// ============================== TABLEROS DE VOCABULARIO (importar / exportar / compartir) ==============================
const BOARD_COLORS = ['noun','verb','people','emo','comida','desc','higiene','school','home','social'];
const BOARD_FORMAT = 'comunica-plus-tablero';
function newCatId(){ return 'cc_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function cleanEmoji(s, fb){ const a = Array.from(String(s||'').trim()).slice(0,8).join(''); return a || fb || '💬'; }
// Todo el vocabulario activo del perfil, sin repetir palabras.
function allVocabWords(p){
  const seen = new Set(), out = [];
  const add = (w, catName)=>{ const k = normalizeWord(w.label); if(!k || seen.has(k)) return; seen.add(k); out.push({ label:w.label, emoji:w.emoji, cat:catName }); };
  CORE_CATEGORIES.forEach(c=>{ if(p.categoriesEnabled[c.id]!==false) c.words.forEach(w=>add(w,c.name)); });
  const theme = THEMES[p.theme];
  if(theme && p.categoriesEnabled.tema!==false) theme.words.forEach(w=>add(w, theme.name));
  (p.customWords||[]).forEach(w=>add(w,'Mis palabras'));
  (p.customCategories||[]).forEach(c=>{ if(p.categoriesEnabled[c.id]!==false) c.words.forEach(w=>add(w,c.name)); });
  msgTokenWords(p).forEach(w=>add(w,'Mensajes'));
  return out;
}
// Fuentes que se pueden exportar como tablero
function boardSources(p){
  const out = [];
  CORE_CATEGORIES.forEach(c=>{ if(p.categoriesEnabled[c.id]!==false) out.push({ key:c.id, name:c.name, emoji:c.emoji, color:c.color, words:c.words, group:'base' }); });
  const theme = THEMES[p.theme];
  if(theme && p.categoriesEnabled.tema!==false) out.push({ key:'tema', name:theme.name, emoji:theme.emoji, color:'noun', words:theme.words, group:'base' });
  if(p.customWords && p.customWords.length) out.push({ key:'mis', name:'Mis palabras', emoji:'⭐', color:'noun', words:p.customWords, group:'propia' });
  (p.customCategories||[]).forEach(c=> out.push({ key:c.id, name:c.name, emoji:c.emoji, color:c.color, words:c.words, group:'propia' }));
  return out;
}
function downloadFile(content, filename, mime){
  const blob = content instanceof Blob ? content : new Blob([content], {type:mime||'application/octet-stream'});
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function safeFileName(s){ return (s||'tablero').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'tablero'; }
async function exportBoard(p, picks, name, desc, includeImages){
  const mem = await ensureWordImages(p.id);
  const cats = picks.map(s=>({
    name:s.name, emoji:s.emoji, color:BOARD_COLORS.includes(s.color)?s.color:'noun',
    words: s.words.map(w=>{
      const o = { label:w.label, emoji:w.emoji };
      if(includeImages){
        const k = normalizeWord(w.label), img = {};
        if(mem.photo[k]) img.photo = mem.photo[k];
        if(mem.arasaac[k]) img.arasaac = mem.arasaac[k];
        if(img.photo || img.arasaac) o.img = img;
      }
      return o;
    })
  }));
  const data = { format:BOARD_FORMAT, version:1, app:'Comunica+', name:name||'Mi tablero', description:desc||'', exportedAt:new Date().toISOString(), includesImages:!!includeImages, categories:cats };
  downloadFile(JSON.stringify(data), 'tablero_'+safeFileName(name)+'.json', 'application/json');
  return cats.reduce((s,c)=>s+c.words.length,0);
}
function validateBoard(data){
  if(!data || typeof data!=='object' || data.format!==BOARD_FORMAT || !Array.isArray(data.categories)) throw new Error('Este archivo no es un tablero de Comunica+.');
  return data;
}
function summarizeBoard(data){
  let words = 0, imgs = 0;
  data.categories.forEach(c=> (c.words||[]).forEach(w=>{ if(w && w.label){ words++; if(w.img && (w.img.photo||w.img.arasaac)) imgs++; } }));
  return { cats:data.categories.length, words, imgs };
}
const IMG_DATA_OK = /^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/;
async function importBoard(p, data){
  p.customCategories = p.customCategories || [];
  const src = String(data.name||'').slice(0,60);
  let cats = 0, words = 0, imgs = 0;
  for(const c of data.categories){
    const name = String(c.name||'Categoría').slice(0,40);
    const ws = (Array.isArray(c.words)?c.words:[]).map(w=>({ label:String((w&&w.label)||'').trim().slice(0,60), emoji:cleanEmoji(w&&w.emoji), img:w&&w.img })).filter(w=>w.label);
    if(!ws.length) continue;
    let cat = p.customCategories.find(x=>x.name===name && x.source===src);
    if(!cat){ cat = { id:newCatId(), name, emoji:cleanEmoji(c.emoji,'📦'), color:BOARD_COLORS.includes(c.color)?c.color:BOARD_COLORS[p.customCategories.length%BOARD_COLORS.length], source:src, words:[] }; p.customCategories.push(cat); }
    cat.words = ws.map(w=>({ label:w.label, emoji:w.emoji }));
    p.categoriesEnabled[cat.id] = true;
    cats++; words += ws.length;
    for(const w of ws){
      if(!w.img || typeof w.img!=='object') continue;
      for(const t of ['photo','arasaac']){
        const d = w.img[t];
        if(typeof d==='string' && d.length<450000 && IMG_DATA_OK.test(d)){ if(await saveWordImage(p.id, t, w.label, d, true)) imgs++; }
      }
    }
  }
  await flushImageIndex(p.id);
  await saveProfile(p);
  return { cats, words, imgs };
}
// "💧 agua" / "agua" / "agua, baño"  →  lista de palabras
function parseWordList(text){
  const out = [];
  String(text||'').split(/\r?\n|;/).forEach(line=>{
    const t = line.trim(); if(!t) return;
    const m = t.match(/^(\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic}|\uFE0F)*)\s*(.+)$/u);
    if(m) out.push({ label:m[2].trim().slice(0,60), emoji:m[1] });
    else t.split(',').forEach(x=>{ const l = x.trim(); if(l) out.push({ label:l.slice(0,60), emoji:'💬' }); });
  });
  return out;
}

  wrap.appendChild(mine);

// ============================== NIVELES AAC ==============================
// Estructura terapéutica en 5 niveles según la función comunicativa. Son una GUÍA de apoyo:
// los criterios se miden con el historial de uso, pero la decisión de avanzar la toma el equipo.
const AAC_LEVELS = [

    acts:['board','messages','practice-story'] },
  { n:3, emoji:'🟠', title:'Combinación de palabras', short:'dos palabras con intención',
    desc:'Unir dos palabras con intención: quiero + agua, más + jugo, mamá + ven.',
    tips:['Cuando use una palabra, modelá la combinación de dos justo después.','Combiná una palabra de acción con una de objeto o persona.','Celebrá las combinaciones espontáneas, aunque no sean perfectas.'],
    vocab:[['yo',null],['tú',null],['mamá',null],['papá',null],['comer',null],['beber',null],['ir',null],['ver',null],['dormir',null],['ven','👋'],['pan',null],['leche',null],['casa',null],['escuela',null],['perro',null],['aquí','📍']],
    checks:['Combina dos palabras con intención','Lo hace de forma espontánea, no solo en práctica','Combina acciones con personas u objetos (mamá + ven)','Combina palabras de distintas categorías'],
    acts:['practice-sequence','board','practice-say'] },
  { n:4, emoji:'🔵', title:'Frases', short:'tres o más palabras',
    desc:'Construir frases de tres o más palabras para pedir, comentar, expresar emociones y preguntar.',
    tips:['Ampliá lo que dice sumando una palabra (si dice «quiero agua», modelá «quiero agua fría»).','Incluí comentarios y emociones, no solo pedidos.','Practicá preguntas simples: qué, dónde, quién.'],

    checks:['Arma frases de tres o más palabras','Usa frases para comentar, no solo para pedir','Responde preguntas simples con una frase','Hace preguntas (qué, dónde, quién)'],
    acts:['practice-sequence','practice-story','board'] },
  { n:5, emoji:'🟣', title:'Conversación', short:'saludar, responder, preguntar, comentar',
    desc:'Saludar, responder, preguntar, comentar y sostener un intercambio durante varios turnos.',
    tips:['Respetá los turnos: preguntá, esperá y respondé a lo que comunica.','Usá rutinas conocidas (saludar, contar cómo estuvo el día) como punto de partida.','Ofrecé temas de interés de la persona para mantener el intercambio.'],
    vocab:[['hola',null],['adiós',null],['gracias',null],['por favor',null],['perdón','🙏'],['estoy bien','👍'],['yo también','🙋'],['contame','🗣️'],['mirá','👀'],['esperá','✋'],['no entiendo','🤔'],['qué pasó','❓']],
    checks:['Inicia una conversación (saludo o pregunta)','Responde y mantiene el tema durante varios turnos','Respeta turnos y espera la respuesta','Cuenta una experiencia o hace un comentario'],
    acts:['practice-story','messages','board'] }
];
const AAC_SYN = { 'ayuda':['ayudar','ayuda'], 'parar':['parar','pará, por favor'], 'quiero':['quiero','querer'], 'adiós':['adiós','chau'] };
const AAC_REQUEST_STARTERS = ['quiero','querer','necesito','necesitar','dame','mas','otro','otra','me das','puedo'];
const AAC_SOCIAL = ['hola','adiós','gracias','por favor','perdón'];
const AAC_DISCLAIMER = 'Los niveles son una guía de apoyo: cada persona avanza a su ritmo y puede estar en niveles distintos según la situación. Los criterios se calculan con el uso registrado en el historial y son orientativos; la decisión de avanzar la toma el equipo terapéutico junto con la familia.';
const AAC_BOARD_MODES = [
  { id:'off',   title:'No cambiar el tablero', desc:'El tablero se ve como siempre.' },
  { id:'first', title:'Pestaña del nivel primero', desc:'Agrega una pestaña «Nivel» con el vocabulario del nivel actual y de los anteriores, y deja el resto disponible.' },
  { id:'only',  title:'Solo el vocabulario del nivel', desc:'El tablero muestra únicamente el vocabulario del nivel actual y de los anteriores. Útil para empezar con pocas opciones.' }
];
function aacCfg(p){
  if(!p.aacLevels || typeof p.aacLevels!=='object') p.aacLevels = {};
  const c = p.aacLevels;
  if(!c.target) c.target = 5;
  c.checks = c.checks || {}; c.history = c.history || [];
  return c;
}
function aacVocab(p, n){
  const c = aacCfg(p);
  if(c.vocab && Array.isArray(c.vocab[n])) return c.vocab[n];
  return AAC_LEVELS[n-1].vocab.map(x=>x[0]);
}
function aacResolveWord(p, label){
  const norm = normalizeWord(label);
  let w = findWordByLabel(p, label);
  if(w.emoji==='💬'){
    for(const lv of AAC_LEVELS){ const d = lv.vocab.find(x=>normalizeWord(x[0])===norm); if(d && d[1]) return { label, emoji:d[1] }; }
  }
  return w;
}
function aacCumulativeLabels(p, upTo){
  const seen = new Set(), out = [];
  for(let n=1;n<=upTo;n++) aacVocab(p,n).forEach(l=>{ const k = normalizeWord(l); if(!seen.has(k)){ seen.add(k); out.push(l); } });
  return out;
}
function aacBoardCategory(p){
  if(!p.aacLevel || !p.aacBoardMode || p.aacBoardMode==='off') return null;
  const words = aacCumulativeLabels(p, p.aacLevel).map(l=>aacResolveWord(p,l));
  return { id:'nivel_aac', name:'Nivel '+p.aacLevel, color:'verb', emoji:'🪜', words };
}
// ----- Medición con el historial de uso -----
function aacUses(u, label){
  const keys = (AAC_SYN[label] || [label]).map(normalizeWord);
  let n = 0; keys.forEach(k=>{ const e = u.words[k]; if(e) n += e.n; });
  return n;
}
function aacItems(f){ return f.c || String(f.x).trim().split(/\s+/).length; }
function aacMetrics(p, n){
  const u = histStats(p).u, T = aacCfg(p).target;
  const phrases = Object.values(u.phrases);
  const out = [];
  if(n===1){
    const ws = aacVocab(p,1), have = ws.filter(l=>aacUses(u,l)>=T).length;
    out.push({ label:`Palabras del nivel usadas al menos ${T} veces`, have, need:ws.length, detail: ws.map(l=>l+': '+aacUses(u,l)).join(' · ') });
  }else if(n===2){
    const reqs = phrases.filter(f=> AAC_REQUEST_STARTERS.includes(normalizeWord(f.x).split(/\s+/)[0]));
    out.push({ label:`Pedidos distintos (frases que empiezan con quiero, necesito, dame, más…)`, have:reqs.length, need:T, detail: reqs.slice(0,6).map(f=>f.x).join(' · ') });
    const ws = aacVocab(p,2), used = ws.filter(l=>aacUses(u,l)>0).length;
    out.push({ label:'Palabras de pedido diferentes usadas', have:used, need:Math.min(T, ws.length), detail:'' });
  }else if(n===3){
    const two = phrases.filter(f=> aacItems(f)===2);
    out.push({ label:'Combinaciones distintas de dos palabras', have:two.length, need:T, detail: two.slice(0,6).map(f=>f.x).join(' · ') });
  }else if(n===4){
    const three = phrases.filter(f=> aacItems(f)>=3);
    out.push({ label:'Frases distintas de tres o más palabras', have:three.length, need:T, detail: three.slice(0,5).map(f=>f.x).join(' · ') });
  }else if(n===5){
    const soc = AAC_SOCIAL.filter(l=>aacUses(u,l)>0).length;
    out.push({ label:'Palabras sociales usadas (hola, adiós, gracias, por favor, perdón)', have:soc, need:3, detail:'' });
    const long = phrases.filter(f=> aacItems(f)>=4);
    out.push({ label:'Frases distintas de cuatro o más palabras', have:long.length, need:T, detail: long.slice(0,4).map(f=>f.x).join(' · ') });
  }
  return out;
}
function aacReady(p, n){ const m = aacMetrics(p,n); return m.length>0 && m.every(x=>x.have>=x.need); }
function aacChecksDone(p, n){ const c = aacCfg(p); return AAC_LEVELS[n-1].checks.filter((_,i)=> c.checks[n+':'+i]).length; }
async function aacSetLevel(p, n){
  const c = aacCfg(p), old = p.aacLevel || null;
  if(old===n) return;
  p.aacLevel = n;
  c.history.push({ t:Date.now(), from:old, to:n });
  if(c.history.length>50) c.history = c.history.slice(-50);
  if(p.aacBoardMode && p.aacBoardMode!=='off') state.activeCategory = 'nivel_aac';
  await saveProfile(p);
}
function aacProgressBar(have, need){
  const pct = need ? Math.min(100, Math.round(100*have/need)) : 0;
  return el('div',{class:'aac-bar'},[ el('div',{class:'aac-bar-fill'+(have>=need?' done':''), style:'width:'+pct+'%'}) ]);
}
// Resumen para el reporte imprimible
function aacSummarySection(p){
  if(!p.aacLevel) return null;
  const lv = AAC_LEVELS[p.aacLevel-1], c = aacCfg(p);
  const sec = el('div',{class:'report-section'});
  sec.appendChild(el('h4',{},'Nivel AAC actual'));
  sec.appendChild(el('p',{style:'margin:0 0 6px;'}, [ el('b',{}, lv.emoji+' Nivel '+lv.n+' · '+lv.title), ' — '+lv.desc ]));
  aacMetrics(p, lv.n).forEach(m=> sec.appendChild(el('div',{class:'trow-sub'}, '• '+m.label+': '+m.have+' de '+m.need+(m.have>=m.need?' ✔':'') )));
  sec.appendChild(el('div',{class:'trow-sub'}, '• Observaciones marcadas: '+aacChecksDone(p,lv.n)+' de '+lv.checks.length));
  if(c.history.length){
    sec.appendChild(el('div',{class:'trow-sub', style:'margin-top:6px;'}, 'Cambios de nivel: '+c.history.slice(-6).map(h=> new Date(h.t).toLocaleDateString('es-AR')+' → nivel '+h.to).join(' · ')));
  }
  return sec;
}

function noteDateLabel(key){

function noteDateShort(key){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(key||''); return m ? m[3]+'/'+m[2]+'/'+m[1] : (key||''); }

// ============================== OBJETIVOS TERAPÉUTICOS ==============================
// Metas con progreso (ej.: «Utilizar quiero + objeto», 12/20 intentos). Pueden contarse solas con el uso real
// (tablero, mensajes, Ayuda rápida) o anotarse a mano durante la sesión. No cuentan los juegos de práctica.
const GOAL_TEMPLATES = [
  { title:'Utilizar «quiero + objeto»', mode:'contains', words:'quiero', minItems:2, target:20 },
  { title:'Pedir ayuda', mode:'word', words:'ayuda', target:10 },
  { title:'Decir «no» para rechazar', mode:'word', words:'no', target:10 },
  { title:'Combinar dos palabras', mode:'minItems', n:2, target:15 },
  { title:'Armar frases de tres o más palabras', mode:'minItems', n:3, target:15 },
  { title:'Saludar (hola / adiós)', mode:'word', words:'hola, adiós', target:10 },
  { title:'Responder a una pregunta (a mano)', mode:'manual', target:10 }
];
const GOAL_SYN = { quiero:['quiero','querer'], querer:['quiero','querer'], necesito:['necesito','necesitar'], necesitar:['necesito','necesitar'], ayuda:['ayuda','ayudar'], ayudar:['ayuda','ayudar'], adios:['adios','chau'] };
function goalWordSet(str){
  const set = new Set();
  String(str||'').split(/[,;\n]/).map(x=>normalizeWord(x)).filter(Boolean).forEach(w=>{ set.add(w); (GOAL_SYN[w]||[]).forEach(s=>set.add(s)); });
  return set;
}
function goalRuleText(g){
  const r = g.rule||{};
  if(r.type==='contains') return 'Se cuenta sola: frases que contienen «'+r.words+'»'+((r.minItems||1)>1?' y tienen al menos '+r.minItems+' palabras':'')+'.';
  if(r.type==='word') return 'Se cuenta sola: cada vez que se usa «'+r.words+'».';
  if(r.type==='minItems') return 'Se cuenta sola: frases de '+r.n+' o más palabras.';
  return 'Se anota a mano: el terapeuta suma los intentos.';
}
function goalAttempt(g, now){
  g.count = (g.count||0) + 1; g.last = now;
  const k = histDayKey(new Date(now)); g.daily = g.daily || {}; g.daily[k] = (g.daily[k]||0) + 1;
  const keys = Object.keys(g.daily); if(keys.length>120){ keys.sort(); keys.slice(0,keys.length-90).forEach(x=>delete g.daily[x]); }
  if(g.count>=g.target && !g.reached) g.reached = now;
}
function goalsOnWord(p, label){
  try{
    const n = normalizeWord(label), now = Date.now();
    (p.goals||[]).forEach(g=>{ if(g.status==='activo' && g.rule && g.rule.type==='word' && goalWordSet(g.rule.words).has(n)) goalAttempt(g, now); });
  }catch(e){}
}
function goalsOnPhrase(p, text, items){
  try{
    const norm = ' '+normalizeWord(text).replace(/[¿?¡!.,;:]/g,' ').replace(/\s+/g,' ').trim()+' ', now = Date.now();
    (p.goals||[]).forEach(g=>{
      if(g.status!=='activo' || !g.rule) return;
      const r = g.rule; let hit = false;
      if(r.type==='contains'){ hit = items>=(r.minItems||1) && Array.from(goalWordSet(r.words)).some(w=> norm.includes(' '+w+' ')); }
      else if(r.type==='minItems') hit = items>=(r.n||2);
      if(hit) goalAttempt(g, now);
    });
  }catch(e){}
}
function freshGoalForm(){ return { id:null, title:'', area:'lenguaje', mode:'contains', words:'quiero', minItems:2, n:3, target:20, due:'', notes:'' }; }
function goalFromForm(f, old){
  const rule = f.mode==='contains' ? { type:'contains', words:String(f.words||'').trim(), minItems:Math.max(1,parseInt(f.minItems)||1) }
             : f.mode==='word' ? { type:'word', words:String(f.words||'').trim() }
             : f.mode==='minItems' ? { type:'minItems', n:Math.max(2,parseInt(f.n)||2) }
             : { type:'manual' };
  const g = old || { id:'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), createdAt:Date.now(), start:histDayKey(new Date()), count:0, status:'activo', daily:{} };
  g.title = f.title.trim().slice(0,120); g.area = f.area; g.rule = rule; g.target = Math.max(1, Math.min(999, parseInt(f.target)||20)); g.due = f.due||''; g.notes = f.notes||'';
  if(old && g.count>=g.target && !g.reached) g.reached = Date.now();
  if(old && g.count<g.target) delete g.reached;
  return g;
}
function goalToForm(g){
  const r = g.rule||{};
  return { id:g.id, title:g.title, area:g.area||'lenguaje', mode:r.type||'manual', words:r.words||'', minItems:r.minItems||1, n:r.n||3, target:g.target, due:g.due||'', notes:g.notes||'' };

function sbGroups(p, words){
  const n = words.length, roles = words.map(sbRole);
  const last = n ? normalizeWord(words[n-1].label) : '', lr = n ? roles[n-1] : 'START', prev = n>1 ? roles[n-2] : null;
  const has = new Set(words.map(w=>normalizeWord(w.label)));
  let g = [];
  switch(lr){
    case 'START': g = [{ t:'Para empezar', l:['yo','quiero','necesito','hola','ayuda','más','no'] }]; break;
    case 'SUJ':
      if(last==='yo') g = [{ t:'¿Qué quiero decir de mí?', l:['quiero','necesito','tengo','estoy','voy','puedo'] }];
      else if(last==='tu') g = [{ t:'¿Qué le pregunto?', l:['quieres','puedes','estás','tienes'] }];
      else g = [{ t:'¿Qué le digo?', l:['ven','dame','ayuda','por favor','gracias'] }];
      break;
    case 'QUIERO': g = [{ t:'¿Qué quiero hacer?', l:['comer','beber','jugar','ir','dormir','ver'] }, { t:'¿Qué quiero?', l:['agua','comida','jugo','juguete','más','galletas'] }]; break;
    case 'NECESITO': g = [{ t:'¿Qué necesito hacer?', l:['ir','descansar','parar','dormir'] }, { t:'¿Qué necesito?', l:['ayuda','agua','baño','comida'] }]; break;
    case 'PUEDO': g = [{ t:'¿Qué puedo hacer?', l: prev==='NEG' ? ['ir','ver','comer','ayuda'] : ['jugar','ir','ver','comer','beber','ayudar'] }]; break;

    case 'GUSTA': g = [{ t:'¿Qué?', l:['jugar','comer','agua','comida','juguete'] }]; break;
    case 'NEG': g = [{ t:'¿Qué no?', l:['quiero','puedo','me gusta','más','gracias'] }]; break;
    case 'MAS': g = [{ t:'¿Más de qué?', l:['agua','jugo','comida','galletas','jugar'] }]; break;
    case 'VERB': g = [{ t: last==='ir' ? '¿Adónde?' : '¿Qué?', l: SB_VERB_OBJ[last] || ['por favor','gracias','más'] }]; break;
    case 'PREG':
      if(last==='donde') g = [{ t:'¿Qué busco?', l:['baño','mamá','papá','casa','juguete'] }];
      else if(last==='quien') g = [{ t:'¿Quién?', l:['mamá','papá','maestra','amigo'] }];
      else g = [{ t:'¿Sobre qué?', l:['comida','juguete','mamá','papá'] }];

    case 'SOCIAL':
      if(last==='hola' || last==='adios') g = [{ t:'¿A quién?', l:['mamá','papá','maestra','amigo'] }];
      else if(last==='por favor') g = [{ t:'¿Qué pido?', l:['ayuda','agua','más','comida'] }];

  return g.map(x=>({ t:x.t, l:x.l.filter(l=>{ const k = normalizeWord(l); return !has.has(k) && (!allowed || allowed.has(k)); }).slice(0,6) })).filter(x=>x.l.length);
}
// Lo que esta persona realmente usa: palabras siguientes y frases completas, según su historial.
function sbPersonal(p){
  const u = ensureUsageLog(p), next1 = {}, next2 = {}, start = {}, full = [];
  Object.values(u.phrases).forEach(e=>{
    if(!Array.isArray(e.l) || e.l.length<1) return;
    const ls = e.l.map(normalizeWord), c = e.n||1;
    start[ls[0]] = (start[ls[0]]||0) + c;
    for(let i=0;i<ls.length-1;i++){
      (next1[ls[i]] = next1[ls[i]]||{})[ls[i+1]] = ((next1[ls[i]]||{})[ls[i+1]]||0) + c;
      if(i>0){ const k = ls[i-1]+'|'+ls[i]; (next2[k] = next2[k]||{})[ls[i+1]] = ((next2[k]||{})[ls[i+1]]||0) + c; }
    }
    full.push({ labels:e.l, norm:ls, n:c });
  });
  return { next1, next2, start, full };
}
function sbTopKeys(o, limit){ return Object.keys(o||{}).sort((a,b)=>o[b]-o[a]).slice(0,limit||4); }
const SB_TEMPLATES = [
  ['yo','quiero','agua'],['yo','quiero','comida'],['yo','quiero','jugar'],['yo','quiero','dormir'],['yo','quiero','ir','baño'],
  ['necesito','ayuda'],['necesito','ir','baño'],['yo','tengo','hambre'],['yo','tengo','sed'],['yo','tengo','sueño'],

];
function sbCompletions(p, words, pers){
  const n = words.length; if(!n) return [];
  const cur = words.map(w=>normalizeWord(w.label)), out = [], seen = new Set();
  const tryAdd = (labels, source)=>{
    const ls = labels.map(normalizeWord);
    if(ls.length<=n) return;
    for(let i=0;i<n;i++) if(ls[i]!==cur[i]) return;
    const key = ls.join(' '); if(seen.has(key)) return; seen.add(key);
    out.push({ labels, rest:labels.slice(n), source });
  };
  pers.full.slice().sort((a,b)=>b.n-a.n).forEach(f=>tryAdd(f.labels,'tuya'));
  SB_TEMPLATES.forEach(t=>tryAdd(t,'modelo'));
  return out.slice(0,4);
}
const SB_FRAMES = [
  { id:'pedir',   emoji:'🙋', title:'Pedir',              start:['yo','quiero'],  slots:['Quién','Quiero / necesito','¿Qué?'] },
  { id:'estado',  emoji:'🙂', title:'Cómo estoy',         start:['yo','estoy'],   slots:['Quién','Estoy','¿Cómo?'] },

  { id:'ir',      emoji:'🚶', title:'Ir a un lugar',      start:['quiero','ir'],  slots:['Quién','Voy / ir','¿Adónde?'] },
  { id:'preguntar', emoji:'❓', title:'Preguntar',        start:['dónde'],        slots:['Pregunta','¿Sobre qué?'] },
  { id:'saludar', emoji:'👋', title:'Saludar',            start:['hola'],         slots:['Saludo','¿A quién?'] }

function sbDetectFrame(words){
  const roles = words.map(sbRole), labels = words.map(w=>normalizeWord(w.label));
  if(!words.length) return null;
  const iq = roles.findIndex(r=>r==='QUIERO'||r==='NECESITO'||r==='PUEDO');
  const rest = i=> roles.slice(i+1).some(r=>r!=='NEG');
  let f = null, done = [];
  if(roles[0]==='PREG'){ f = 'preguntar'; done = [true, words.length>1]; }
  else if(roles[0]==='SOCIAL'){ f = 'saludar'; done = [true, words.length>1]; }
  else if(iq>=0){ f = 'pedir'; done = [roles[0]==='SUJ', true, rest(iq)]; }
  else if(roles.includes('TENGO')){ const i = roles.indexOf('TENGO'); f = 'sentir'; done = [roles[0]==='SUJ', true, rest(i)]; }
  else if(roles.includes('ESTOY')){ const i = roles.indexOf('ESTOY'); f = 'estado'; done = [roles[0]==='SUJ', true, rest(i)]; }
  else if(roles.includes('VOY') || labels.includes('ir')){ const i = Math.max(roles.indexOf('VOY'), labels.indexOf('ir')); f = 'ir'; done = [roles[0]==='SUJ', true, rest(i)]; }
  if(!f) return null;
  const fr = SB_FRAMES.find(x=>x.id===f);
  return { frame:fr, done };
}

    box.appendChild(row);
  }else if(det){
    const strip = el('div',{class:'sb-frame'},[ el('span',{class:'prediction-label'}, det.frame.emoji+' '+det.frame.title+':') ]);
    const now = det.done.findIndex(d=>!d);
    det.frame.slots.forEach((s,i)=> strip.appendChild(el('span',{class:'sb-slot'+(det.done[i]?' done':'')+(i===now?' now':'')}, (det.done[i]?'✓ ':(i===now?'👉 ':''))+s)));
    if(now===-1) strip.appendChild(el('span',{class:'sb-ready'}, '¡Lista! Tocá «Hablar» cuando quieras.'));
    box.appendChild(strip);
  }
  // 2) Ideas contextuales
  const groups = sbGroups(p, words);
  const last = words.length ? normalizeWord(words[words.length-1].label) : '', prevL = words.length>1 ? normalizeWord(words[words.length-2].label) : null;
  const used = new Set(words.map(w=>normalizeWord(w.label)));
  let persNext = [];
  if(!words.length) persNext = sbTopKeys(pers.start, 4);
  else persNext = sbTopKeys((prevL && pers.next2[prevL+'|'+last]) || pers.next1[last], 4);
  persNext = persNext.filter(k=>!used.has(k));
  const shown = new Set();
  const addRow = (title, labels, personal)=>{
    if(!labels.length) return;
    const row = el('div',{class:'prediction-row'},[ el('span',{class:'prediction-label'}, title) ]);
    labels.forEach(lbl=>{
      const w2 = findWordByLabel(p, lbl);
      row.appendChild(el('button',{class:'prediction-chip scan-item'+(personal?' personal':''), 'data-scan-label':w2.label, onclick:()=>sbAddWord(p, w2)},[ symbolEl(w2), ' '+w2.label ]));
    });
    box.appendChild(row);
  };
  if(persNext.length){ addRow('⭐ Lo que suele usar:', persNext.map(k=>{ const hit = pers.full.find(f=>f.norm.includes(k)); const idx = hit ? hit.norm.indexOf(k) : -1; return idx>=0 ? hit.labels[idx] : k; }), true); persNext.forEach(k=>shown.add(k)); }
  groups.forEach(g=>{
    const ls = g.l.filter(l=>!shown.has(normalizeWord(l)));
    // las que la persona ya usó van primero
    ls.sort((a,b)=> ((pers.next1[last]||{})[normalizeWord(b)]||0) - ((pers.next1[last]||{})[normalizeWord(a)]||0));
    addRow('💡 '+g.t, ls, false);
  });
  // 3) Completar la frase
  const comps = sbCompletions(p, words, pers);
  if(comps.length){
    const row = el('div',{class:'prediction-row'},[ el('span',{class:'prediction-label'}, '✨ Completar la frase de una vez:') ]);
    comps.forEach(c=> row.appendChild(el('button',{class:'prediction-chip scan-item'+(c.source==='tuya'?' personal':''), 'data-scan-label':c.labels.join(' '), onclick:()=>sbAddWords(p, c.rest.map(l=>findWordByLabel(p,l)))},
      [ (c.source==='tuya'?'⭐ ':'')+words.map(w=>w.label).join(' ')+' ', el('b',{}, c.rest.join(' ')) ])));
    box.appendChild(row);
  }
  return box;
}

// usando el estilo de imagen del perfil (emoji, foto o ARASAAC). También puede tener una imagen propia para toda la frase.
const MSG_GROUP_COLORS = { pedir:'#6E5DE0', entender:'#2F9BD1', malestar:'#E0845C', espacio:'#7E57C2', conversar:'#43A047', urgente:'#E0463C' };
const MSG_STOP = new Set(['a','al','el','la','lo','los','las','un','una','unos','unas','de','del','en','y','e','o','u','que','le','se','me','te','mi','mis','tu','su','para','con','es','hay','esto','esta','este','algo','ya','estar']);
// Palabras de los mensajes que no están en el vocabulario: su dibujo (con tilde exacta cuando importa)
const MSG_LEX = {
  'repetí':'🔁', 'explicame':'💡', 'despacio':'🐢', 'esperá':'⏳', 'pensando':'🤔', 'cambié':'🔄', 'opinión':'💭', 'entiendo':'🤔',

  'solo':'🚪', 'privacidad':'🔒', 'momento':'⏸️', 'solas':'🌙', 'tiempo':'⏳', 'quedate':'🤝', 'conmigo':'🤝', 'acuerdo':'🤝',
  'contame':'👂', 'pregunta':'❓', 'chau':'👋', 'luego':'👋', 'hasta':'👋', 'pará':'✋', 'toques':'🚫', 'irme':'🏃', 'llamar':'📞',
  'elegir':'☝️', 'decirte':'🗣️', 'decir':'🗣️', 'terminé':'✅', 'acepto':'👍', 'duele':'🤕', 'privacidad ':'🔒', 'día':'☀️', 'buen':'☀️', 'cómo':'🙂', 'estás':'🙂',
  'sed':'🥤', 'hambre':'😋', 'sueño':'😴', 'ven':'👋', 'dame':'🫴', 'descansar':'🛋️', 'ayuda':'🆘', 'agradezco':'💜', 'perdón':'🙏'
};
const MSG_ALIAS = { quiero:'querer', quieres:'querer', tomar:'beber', 'tomo':'beber', voy:'ir', irme:'ir', 'comer':'comer', duele:null };
let MSG_LOOKUP_CACHE = null, MSG_LOOKUP_SIG = '';
function msgLookup(p){
  const sig = (p.theme||'')+'|'+((p.customWords||[]).length)+'|'+((p.customCategories||[]).map(c=>c.words.length).join(','));
  if(MSG_LOOKUP_CACHE && MSG_LOOKUP_SIG===sig) return MSG_LOOKUP_CACHE;
  const map = {};
  const add = w=>{ const k = normalizeWord(w.label); if(k && !map[k]) map[k] = w; };
  CORE_CATEGORIES.forEach(c=> c.words.forEach(add));
  const theme = THEMES[p.theme]; if(theme) theme.words.forEach(add);
  (p.customWords||[]).forEach(add);
  (p.customCategories||[]).forEach(c=> c.words.forEach(add));
  MSG_LOOKUP_CACHE = map; MSG_LOOKUP_SIG = sig;
  return map;
}
// Texto → [{w:{label,emoji}|null, caption, known}] (omite palabras de enlace; une palabras compuestas como «por favor»)
function msgTiles(p, text){
  const look = msgLookup(p);
  const raw = String(text||'').replace(/[¿?¡!.,;:…]/g,' ').split(/\s+/).filter(Boolean);
  const norm = raw.map(normalizeWord), low = raw.map(t=>t.toLowerCase());
  const tiles = [];
  for(let i=0;i<raw.length;){
    let hit = null, len = 1;
    for(let n=Math.min(4, raw.length-i); n>=2; n--){
      const key = norm.slice(i,i+n).join(' ');
      if(look[key]){ hit = look[key]; len = n; break; }
    }
    if(!hit){
      const l = low[i], k = norm[i];
      if(MSG_STOP.has(l)){ i++; continue; }
      const alias = MSG_ALIAS[k];
      if(MSG_LEX[l]) hit = { label:raw[i], emoji:MSG_LEX[l] };
      else if(look[k]) hit = look[k];
      else if(alias && look[alias]) hit = look[alias];
      else if(PRED_EMOJI[l] || PRED_EMOJI[k]) hit = { label:raw[i], emoji:PRED_EMOJI[l]||PRED_EMOJI[k] };
      else if(MSG_LEX[k]) hit = { label:raw[i], emoji:MSG_LEX[k] };
    }
    const caption = raw.slice(i,i+len).join(' ');
    tiles.push({ w:hit, caption, known:!!hit });
    i += len;
  }
  return tiles;
}
// Palabras de los mensajes que aún no están en el vocabulario (para cargarles imagen)
function msgTokenWords(p){
  const out = [], seen = new Set();
  (p.messages||[]).forEach(m=> msgTiles(p, m.text).forEach(t=>{
    if(!t.w) return;
    const k = normalizeWord(t.w.label); if(seen.has(k)) return; seen.add(k);
    out.push({ label:t.w.label, emoji:t.w.emoji });
  }));
  return out;
}
function msgOwnImage(p, m){
  const mem = imgMem[p.id]; if(!mem) return null;
  const k = normalizeWord(m.text), style = p.symbolStyle==='photo' ? ['photo','arasaac'] : ['arasaac','photo'];
  for(const t of style){ if(mem[t][k]) return mem[t][k]; }
  return null;
}
function msgViewMode(p){ return p.messageView==='text' ? 'text' : 'visual'; }
// Tarjeta visual de un mensaje. opts.compact → versión chica (para la edición y los fijados).
function messageVisualEl(p, m, opts){
  opts = opts || {};
  const own = msgOwnImage(p, m);
  const box = el('div',{class:'msg-visual'+(opts.compact?' compact':'')});
  const tiles = el('div',{class:'msg-tiles'});
  if(own){
    tiles.appendChild(el('div',{class:'msg-tile whole'},[ el('img',{class:'msg-whole-img', src:own, alt:m.text, draggable:'false'}) ]));
  }else{
    const ts = msgTiles(p, m.text).slice(0, opts.compact ? 5 : 8);
    ts.forEach((t,i)=>{
      const sym = t.w ? symbolEl({ label:t.w.label, emoji:t.w.emoji }, p) : null;
      tiles.appendChild(el('div',{class:'msg-tile'+(t.known?'':' unknown')},[ sym || el('span',{class:'msg-textonly'}, t.caption), (sym && !opts.compact) ? el('span',{class:'msg-cap'}, t.caption) : null ]));
      if(!opts.compact && i<ts.length-1) tiles.appendChild(el('span',{class:'msg-plus'}, '+'));
    });
    if(!ts.length) tiles.appendChild(el('div',{class:'msg-tile'},[ el('span',{class:'emoji'}, m.emoji||'💬') ]));
  }
  box.appendChild(tiles);

  if(st.totalWords===0 && st.totalPhrases===0){ doc.appendChild(el('div',{class:'trow-sub'}, 'Todavía no hay uso registrado.')); }
  else{
    doc.appendChild(el('div',{class:'trow-sub', style:'margin-bottom:6px;'}, 'Desde el '+new Date(u.since).toLocaleDateString('es-AR')+': '+st.totalWords+' palabras usadas ('+st.words.length+' distintas) y '+st.totalPhrases+' frases o mensajes. En los últimos 7 días: '+st.week+' palabras.'));
    doc.appendChild(histWordsTable(st.words, st.totalWords, 10));
    if(st.phrases.length){ doc.appendChild(el('div',{style:'height:10px'})); doc.appendChild(histPhrasesTable(st.phrases, 6)); }
    const peak = histPeakHour(u.hours);
    if(peak>=0){
      doc.appendChild(el('div',{class:'trow-sub', style:'margin-top:8px;'}, 'Franja de mayor uso: '+histHourRange(peak)+'.'));
      doc.appendChild(el('div',{html: histBarsSVG(u.hours, u.hours.map((_,h)=>histPad(h)), {every:3}), style:'max-width:480px;'}));
    }
  }

  // Objetivos
  const goals = (p.goals||[]).filter(g=>g.status!=='pausado');
  doc.appendChild(el('h4',{class:'clin-h'},'3. Objetivos terapéuticos'));
  if(!goals.length) doc.appendChild(el('div',{class:'trow-sub'}, 'No hay objetivos registrados.'));
  else{
    const gt = el('table',{class:'hist-table'},[ el('tr',{},[ el('th',{},'Objetivo'), el('th',{},'Estado'), el('th',{class:'num'},'Progreso'), el('th',{},'Inicio') ]) ]);
    goals.forEach(g=> gt.appendChild(el('tr',{},[ el('td',{class:'hist-word'}, g.title), el('td',{class:'muted'}, g.status==='logrado'?'Logrado':'En curso'), el('td',{class:'num'}, (g.count||0)+' / '+g.target+' intentos'), el('td',{class:'muted'}, noteDateShort(g.start)) ])));
    doc.appendChild(gt);
  }

  // Observaciones del período
  const notes = sortedNotes(p).filter(n=> n.date>=state.clinFrom && n.date<=state.clinTo);
  doc.appendChild(el('h4',{class:'clin-h'},'4. Observaciones clínicas del período ('+notes.length+')'));
  if(!notes.length) doc.appendChild(el('div',{class:'trow-sub'}, 'No hay observaciones registradas en este período.'));
  NOTE_AREAS.forEach(a=>{
    const list = notes.filter(n=>(n.areas||[]).includes(a.id)); if(!list.length) return;
    doc.appendChild(el('div',{class:'clin-area'}, a.emoji+' '+a.name+' ('+list.length+')'));
    list.slice().sort((x,y)=>(x.date||'').localeCompare(y.date||'')).forEach(n=>{
      const how = (NOTE_HOW.find(h=>h.id===n.how)||{}).label;
      doc.appendChild(el('div',{class:'note-row'},[ el('div',{class:'note-date'}, noteDateShort(n.date)), el('div',{class:'note-text'}, n.text+(how?'  ('+how.toLowerCase()+')':'')) ]));
    });
  });

  if((c.impression||'').trim()){ doc.appendChild(el('h4',{class:'clin-h'},'5. Valoración del profesional')); doc.appendChild(clinText(c.impression)); }
  if((c.recommendations||'').trim()){ doc.appendChild(el('h4',{class:'clin-h'},((c.impression||'').trim()?'6':'5')+'. Recomendaciones y próximos pasos')); doc.appendChild(clinText(c.recommendations)); }

  doc.appendChild(el('div',{class:'clin-sign'},[ el('div',{class:'clin-line'}), el('div',{class:'trow-sub'}, (c.professional||'Firma y aclaración del profesional')) ]));
  doc.appendChild(el('div',{class:'trow-sub', style:'margin-top:12px;'}, 'Informe generado por Comunica+ a partir de los datos registrados en el dispositivo (uso del sistema, objetivos y observaciones). No reemplaza la evaluación ni el criterio del profesional tratante. '+(p.symbolStyle==='arasaac'?'Pictogramas: ARASAAC (arasaac.org), Gobierno de Aragón, licencia CC BY-NC-SA.':'')));
  wrap.appendChild(doc);
  return wrap;
}

function wordCatLabel(c){ return c ? (c.emoji+' '+c.name) : ''; }
// Devuelve [{word, cat, score}] ordenado: exacta > empieza con > palabra que empieza > contiene > sinónimo > categoría.
function searchVocabulary(catList, query){
  const q = normalizeWord(query);
  if(!q) return [];
  const seen = new Set();
  const out = [];
  catList.forEach(cat=>{
    (cat.words||[]).forEach(w=>{
      const key = normalizeWord(w.label)+'|'+w.emoji;
      if(seen.has(key)) return;
      const lab = normalizeWord(w.label);
      let score = -1;
      if(lab===q) score = 0;
      else if(lab.startsWith(q)) score = 1;
      else if(lab.split(/\s+/).some(t=>t.startsWith(q))) score = 2;
      else if(lab.includes(q)) score = 3;
      else {
        const al = SEARCH_ALIASES[lab] || [];
        if(al.some(a=>normalizeWord(a).startsWith(q) || (q.length>=3 && normalizeWord(a).includes(q)))) score = 4;
        else if(q.length>=3 && normalizeWord(cat.name).includes(q)) score = 5;
      }
      if(score>=0){ seen.add(key); out.push({word:w, cat, score}); }
    });
  });
  out.sort((a,b)=> a.score-b.score || a.word.label.localeCompare(b.word.label,'es'));
  return out;
}

  const aacCat = aacBoardCategory(p);

  if(!catList.find(c=>c.id===state.activeCategory)) state.activeCategory = catList[0]?catList[0].id:null;

  // ----- Buscador -----

  const resultsBox = el('div',{});

      resultsBox.appendChild(el('div',{class:'search-empty'}, [ el('div',{style:'font-size:40px;'}, '🤔'), 'No encontré «'+q.trim()+'». Probá con otra palabra o buscá por categoría (borrá la búsqueda con ✕).' ]));

      resultsBox.appendChild(el('div',{class:'search-count'}, found.length+(found.length===1?' resultado':' resultados')));
      const grid = el('div',{class:'picto-grid grid-'+p.gridSize});
      found.slice(0,60).forEach(({word:w, cat})=>{
        const style = cat.color ? `background:var(--cat-${cat.color}); color:var(--cat-${cat.color}-ink);` : `background:${cat.themeColor}; color:${cat.themeInk};`;
        grid.appendChild(el('div',{class:'picto-cell'},[
          el('button',{class:'picto-btn scan-item', style, 'data-scan-label':w.label, onclick:(ev)=>pickFromSearch(w, ev)},[
            symbolEl(w), el('span',{class:'label'}, w.label), el('span',{class:'cat-hint'}, wordCatLabel(cat))
          ])
        ]));
      });
      resultsBox.appendChild(grid);
    }
    applyEmojiIcons(resultsBox);
    if(p.scanningEnabled) setupScanning(p);
  }
  searchInput.addEventListener('input', applySearch);
  searchInput.addEventListener('focus', ()=>{ state.searchFocus = true; });
  searchInput.addEventListener('blur', ()=>{ state.searchFocus = false; });
  searchInput.addEventListener('keydown', (e)=>{
    if(e.key==='Escape'){ searchInput.value=''; applySearch(); }
    else if(e.key==='Enter'){
      const found = searchVocabulary(catList, searchInput.value);
      if(found.length>=1){ e.preventDefault(); pickFromSearch(found[0].word, {currentTarget: searchInput}); }
    }
  });
  wrap.appendChild(resultsBox);
  wrap.appendChild(browse);

  const tabs = el('div',{class:'category-tabs'});
  catList.forEach(c=>{
    const active = state.activeCategory===c.id;
    let style = '';
    if(active) style = c.color ? `background:var(--cat-${c.color}); border-color:var(--cat-${c.color});` : `background:${c.themeColor}; border-color:${c.themeColor}; color:${c.themeInk};`;
    tabs.appendChild(el('button',{class:'tab-btn'+(active?' active':'')+' scan-item', style, onclick:()=>{ state.activeCategory=c.id; state.boardPage=0; render(); }}, c.emoji+' '+c.name));
  });
  browse.appendChild(tabs);

  const activeCat = catList.find(c=>c.id===state.activeCategory);
  const gridEl = el('div',{class:'picto-grid grid-'+p.gridSize});
  if(activeCat){
    const totalPages = Math.max(1, Math.ceil(activeCat.words.length / p.gridSize));
    if(state.boardPage >= totalPages) state.boardPage = totalPages-1;
    if(state.boardPage < 0) state.boardPage = 0;
    const start = state.boardPage * p.gridSize;
    const pageWords = activeCat.words.slice(start, start + p.gridSize);
    const voiceIdx = await ensureVoiceIndex(p.id);
    pageWords.forEach(w=>{
      const style = activeCat.color
        ? `background:var(--cat-${activeCat.color}); color:var(--cat-${activeCat.color}-ink);`
        : `background:${activeCat.themeColor}; color:${activeCat.themeInk};`;
      const hasRec = voiceIdx.has(normalizeWord(w.label));
      const pictoBtn = el('button',{class:'picto-btn scan-item', style, 'data-scan-label':w.label, onclick: async (ev)=>{
        markInteraction();
        state.sentence.push(w);
        mascotWordReaction(w.label);
        hapticFeedback(p, 'good');
        sparkAt(ev.currentTarget, p);
        speakItem(p, w);
        recordWordUse(p, w);
        p.progress.wordsSpoken += 1; await afterProgressUpdate(p); render();
      }},[ symbolEl(w), el('span',{class:'label'}, w.label) ]);
      const badge = el('button',{class:'voice-badge'+(hasRec?' has-rec':''), title:'Grabar voz propia', onclick: async (e)=>{
        e.stopPropagation();
        state.recordingWord = w;
        state.wordRecorder = { recording:false, mediaRecorder:null, previewDataUri:null, existingDataUri:null };
        render();
        try{
          const res = await Storage.get('voice-clip:'+p.id+':'+normalizeWord(w.label));
          if(res && res.value){ state.wordRecorder.existingDataUri = res.value; render(); }
        }catch(e){}
      }}, hasRec ? '🎙️' : '➕');
      gridEl.appendChild(el('div',{class:'picto-cell'},[pictoBtn, badge]));
    });
    browse.appendChild(gridEl);
    if(totalPages > 1){
      browse.appendChild(el('div',{class:'sentence-actions', style:'justify-content:center; margin-top:14px;'},[
        el('button',{class:'pill-btn', disabled: state.boardPage===0, onclick:()=>{ state.boardPage -= 1; render(); }}, '‹ Anterior'),
        el('span',{class:'muted'}, `Página ${state.boardPage+1} de ${totalPages}`),
        el('button',{class:'pill-btn', disabled: state.boardPage>=totalPages-1, onclick:()=>{ state.boardPage += 1; render(); }}, 'Siguiente ›')
      ]));
    }
  }else{
    browse.appendChild(gridEl);
  }
  // Estado inicial del buscador (si había texto, se vuelve a mostrar el resultado)
  if((state.searchQuery||'').trim()) applySearch(); else clearBtn.style.display='none';
  if(state.searchFocus) setTimeout(()=>{ try{ searchInput.focus(); const l=searchInput.value.length; searchInput.setSelectionRange(l,l); }catch(e){} },0);
  wrap.appendChild(el('div',{class:'helper-note'}, '💡 Cada imagen dice su palabra al tocarla. Tocá el círculo ➕/🎙️ en la esquina de cada imagen para grabar la voz real del niño diciendo esa palabra — una vez grabada, el tablero la usa en vez de la voz sintética.'));
  return wrap;
}

async function renderVoiceRecorderPanel(p, word){
  const wr = state.wordRecorder;
  const panel = el('div',{class:'voice-recorder-panel'});
  panel.appendChild(el('div',{class:'section-sub'},'🎙️ Grabar la voz del niño para:'));
  panel.appendChild(el('div',{class:'say-target'},[ el('span',{class:'say-emoji'}, word.emoji), el('div',{class:'big-word'}, word.label) ]));

  if(wr.previewDataUri){
    panel.appendChild(el('audio',{controls:'controls', src:wr.previewDataUri}));
    panel.appendChild(el('div',{class:'manual-check'},[
      el('button',{class:'pill-btn solid', onclick: async ()=>{
        const key = 'voice-clip:'+p.id+':'+normalizeWord(word.label);
        try{ await Storage.set(key, wr.previewDataUri); }catch(e){}
        const idx = await ensureVoiceIndex(p.id);
        idx.add(normalizeWord(word.label));
        await saveVoiceIndex(p.id, idx);
        state.recordingWord = null;
        state.wordRecorder = { recording:false, mediaRecorder:null, previewDataUri:null, existingDataUri:null };
        render();
      }}, '💾 Guardar'),
      el('button',{class:'pill-btn', onclick:()=>{ wr.previewDataUri=null; render(); }}, '🔁 Grabar de nuevo'),
      el('button',{class:'pill-btn', onclick:()=>{ state.recordingWord=null; render(); }}, '✖️ Cancelar')
    ]));
  }else{
    if(canRecordAudio()){
      panel.appendChild(el('button',{class:'mic-btn record'+(wr.recording?' recording':''), onclick: async ()=>{
        if(wr.recording){ if(wr.mediaRecorder) wr.mediaRecorder.stop(); return; }
        try{
          const stream = await navigator.mediaDevices.getUserMedia({audio:true});
          activeMicStream = stream;
          const chunks = [];
          const mr = new MediaRecorder(stream);
          mr.ondataavailable = e=>{ if(e.data && e.data.size>0) chunks.push(e.data); };
          mr.onstop = ()=>{
            const blob = new Blob(chunks, {type: mr.mimeType || 'audio/webm'});
            const reader = new FileReader();
            reader.onloadend = ()=>{
              wr.previewDataUri = reader.result; wr.recording = false;
              stream.getTracks().forEach(t=>t.stop());
              render();
            };
            reader.readAsDataURL(blob);
          };
          wr.mediaRecorder = mr; wr.recording = true; mr.start(); render();
        }catch(e){ alert('No se pudo acceder al micrófono. Revisá los permisos del navegador.'); }
      }},[ el('span',{}, wr.recording?'⏹️':'⏺️'), wr.recording ? 'Detener grabación' : 'Grabar' ]));
    }else{
      panel.appendChild(el('div',{class:'helper-note'}, 'Este navegador no permite grabar audio.'));
    }
    if(wr.existingDataUri){
      panel.appendChild(el('div',{class:'section-sub', style:'margin-top:14px;'}, 'Grabación actual:'));
      panel.appendChild(el('audio',{controls:'controls', src:wr.existingDataUri}));
      panel.appendChild(el('div',{class:'manual-check'},[
        el('button',{class:'pill-btn warn', onclick: async ()=>{
          const key = 'voice-clip:'+p.id+':'+normalizeWord(word.label);
          try{ await Storage.delete(key); }catch(e){}
          const idx = await ensureVoiceIndex(p.id);
          idx.delete(normalizeWord(word.label));
          await saveVoiceIndex(p.id, idx);
          state.recordingWord = null; render();
        }}, '🗑️ Borrar grabación')
      ]));
    }
    panel.appendChild(el('div',{class:'manual-check'},[
      el('button',{class:'pill-btn', onclick:()=>{ state.recordingWord=null; render(); }}, '✖️ Cerrar')
    ]));
  }
  return panel;
}

function collectAllWordsForPractice(p){
  const theme = THEMES[p.theme];
  let pool = [];
  CORE_CATEGORIES.forEach(c=>{ if(p.categoriesEnabled[c.id]!==false) pool = pool.concat(c.words); });
  if(theme && p.categoriesEnabled.tema!==false) pool = pool.concat(theme.words);
  if(p.customWords) pool = pool.concat(p.customWords);
  (p.customCategories||[]).forEach(cc=>{ if(p.categoriesEnabled[cc.id]!==false) pool = pool.concat(cc.words); });
  return pool;
}
function categorizedPools(p){
  const theme = THEMES[p.theme];
  const map = {};
  CORE_CATEGORIES.forEach(c=>{ if(p.categoriesEnabled[c.id]!==false) map[c.id]=c.words; });
  if(theme && p.categoriesEnabled.tema!==false) map.tema = theme.words;
  (p.customCategories||[]).forEach(cc=>{ if(p.categoriesEnabled[cc.id]!==false && cc.words.length>=3) map[cc.id] = cc.words; });
  return map;
}

// -------- Escuchar y elegir / Leer y elegir --------
async function startSimplePractice(mode){
  const p = await loadProfile(state.currentId);
  const pool = collectAllWordsForPractice(p);
  const nOptions = Math.min(getOptionsCount(p), pool.length);
  if(pool.length < 2) { alert('Activá al menos 2 palabras en la configuración para poder practicar.'); return; }
  const target = pool[Math.floor(Math.random()*pool.length)];
  const distractors = pool.filter(w=>w.label!==target.label).sort(()=>Math.random()-0.5).slice(0, Math.max(1,nOptions-1));
  const options = [target, ...distractors].sort(()=>Math.random()-0.5);
  state.practice = { target, options, locked:false, feedback:null };
  setMascotMood(null,'idle');
  state.view = mode; render();
  if(mode==='practice-listen') setTimeout(()=>speakItem(p, target), 200);
}
async function resolvePracticeChoice(p, target, isTarget, nextMode){
  state.practice.locked = true;
  markInteraction();
  p.progress.practiceAttempts += 1;
  registerStreak(p, isTarget);
  p.progress.compAttempts = (p.progress.compAttempts||0) + 1; if(isTarget) p.progress.compCorrect = (p.progress.compCorrect||0) + 1;
  hapticFeedback(p, isTarget?'good':'bad');
  if(isTarget){ state.practice.feedback='good'; setMascotMood(p,'good',{speak:true, delayMs:1500}); p.progress.practiceCorrect += 1; speak('¡Muy bien! '+target.label, p.voiceRate, p.voicePitch); }
  else{ state.practice.feedback={type:'bad', correct:target}; setMascotMood(p,'bad',{speak:true, delayMs:1900}); speak('No es esa. La correcta es: '+target.label, p.voiceRate, p.voicePitch); }
  await afterProgressUpdate(p); render();
  setTimeout(()=>startSimplePractice(nextMode), 2200);
}
function feedbackBanner(feedback){
  if(!feedback) return el('div',{class:'feedback-banner'},'');
  if(feedback==='good' || (feedback.type==='good')) return el('div',{class:'feedback-banner good'},'¡Muy bien! 🎉');
  if(feedback==='bad') return el('div',{class:'feedback-banner bad'},'Casi… ¡probemos otra! 💜');
  if(feedback.type==='bad'){
    const w = feedback.correct;
    return el('div',{class:'feedback-banner bad'},[
      '❌ Te equivocaste. La respuesta correcta es: ',
      symbolEl(w), ' ', el('b',{},w.label)
    ]);
  }
  if(feedback.type==='bad-hint'){
    return el('div',{class:'feedback-banner bad'},'❌ Esa no va ahí. Escuchá de nuevo cuál sigue 👂');
  }
  if(feedback.type==='memo-miss'){
    const d = c => c.kind==='pic' ? [symbolEl(c.word)] : [el('b',{}, c.word.label)];
    return el('div',{class:'feedback-banner bad'},['❌ No son pareja: ', ...d(feedback.a), ' y ', ...d(feedback.b), '. ¡Probá otra vez!']);
  }
  if(feedback.type==='wrong-slot'){
    return el('div',{class:'feedback-banner bad'},'❌ Esa pieza no va ahí. ¡Fijate bien en el dibujo!');
  }
  return el('div',{class:'feedback-banner'},'');
}
function optionsGrid(target, options, locked, onChoose){

  return optGrid;
}
