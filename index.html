<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Comunica+ · Plataforma AAC</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6E5DE0">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Comunica+">
<style>
  :root{
    --bg: #F5F3FB;
    --surface: #FFFFFF;
    --surface-2: #FBFAFF;
    --ink: #2B2640;
    --ink-soft: #6B6480;
    --line: #E4E0F3;
    --accent: #6E5DE0;
    --amber: #FFB43C;

    --cat-people: #F4CB3A;    --cat-people-ink: #4A3E00;
    --cat-verb: #7BC24A;      --cat-verb-ink: #FFFFFF;
    --cat-emo: #F2836B;       --cat-emo-ink: #FFFFFF;
    --cat-desc: #4DA6E8;      --cat-desc-ink: #FFFFFF;
    --cat-noun: #F2913C;      --cat-noun-ink: #FFFFFF;
    --cat-higiene: #3FB6AE;   --cat-higiene-ink: #FFFFFF;
    --cat-aseo: #6E90C7;      --cat-aseo-ink: #FFFFFF;
    --cat-vestirse: #D9A441;  --cat-vestirse-ink: #4A3200;
    --cat-school: #5B6EE1;    --cat-school-ink: #FFFFFF;
    --cat-church: #8E5B9B;    --cat-church-ink: #FFFFFF;
    --cat-home: #B5754A;      --cat-home-ink: #FFFFFF;
    --cat-colores: #A97BDE;   --cat-colores-ink: #FFFFFF;
    --cat-figuras: #7C8CA6;   --cat-figuras-ink: #FFFFFF;
    --cat-dinero: #48A868;    --cat-dinero-ink: #FFFFFF;
    --cat-trabajo: #3F6FA6;   --cat-trabajo-ink: #FFFFFF;
    --cat-transporte: #2E8B8B; --cat-transporte-ink: #FFFFFF;
    --cat-salud: #C0576E;     --cat-salud-ink: #FFFFFF;
    --cat-social: #E96FA0;    --cat-social-ink: #FFFFFF;
    --cat-question: #9C7FE0;  --cat-question-ink: #FFFFFF;
    --cat-dolor: #C1443E;     --cat-dolor-ink: #FFFFFF;
    --cat-comida: #E2865B;    --cat-comida-ink: #FFFFFF;

    --radius-lg: 22px;
    --radius-md: 14px;
    --shadow-1: 0 2px 0 rgba(43,38,64,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:'Atkinson Hyperlegible', sans-serif; min-height:100vh; position:relative; overflow-x:hidden;}
  body::before{ content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(circle at 12% 18%, rgba(255,180,60,.28), transparent 42%),
      radial-gradient(circle at 88% 12%, rgba(110,93,224,.26), transparent 42%),
      radial-gradient(circle at 50% 95%, rgba(75,187,166,.22), transparent 46%),
      radial-gradient(circle at 90% 80%, rgba(233,111,160,.18), transparent 40%);
    filter:blur(50px);
    transition:opacity .3s ease;
  }
  body[data-style="adolescente"]::before{ opacity:.4; filter:blur(70px);}
  h1,h2,h3,.display{ font-family:'Baloo 2', sans-serif; margin:0; }
  button{font-family:inherit; cursor:pointer;}
  #app{max-width:1180px; margin:0 auto; padding:18px 18px 48px;}

  /* ---------- Top bar ---------- */
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-badge{ width:44px; height:44px; border-radius:14px; background:var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:24px; box-shadow:var(--shadow-1);}
  .brand h1{font-size:22px; font-weight:800; color:var(--ink);}
  .brand span{font-size:12px; color:var(--ink-soft); font-weight:400; font-family:'Atkinson Hyperlegible';}
  .top-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .pill-btn{ border:2px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px;
    padding:9px 16px; font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:6px;
    transition:transform .12s ease, border-color .12s ease;}
  .pill-btn:hover{border-color:var(--accent); transform:translateY(-1px);}
  .pill-btn.solid{background:var(--accent); color:#fff; border-color:var(--accent);}
  .pill-btn.solid:hover{filter:brightness(1.06);}
  .pill-btn.warn{border-color:#E8574F; color:#B23A34;}
  .pill-btn[disabled]{opacity:.5; pointer-events:none;}

  /* ---------- Cards / generic ---------- */
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:22px; box-shadow:var(--shadow-1);}
  .muted{color:var(--ink-soft);}
  .section-title{font-size:19px; font-weight:800; margin-bottom:4px;}
  .section-sub{color:var(--ink-soft); font-size:14px; margin-bottom:16px;}

  /* ---------- Profiles view ---------- */
  .profile-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px; margin-top:16px;}
  .profile-card{ background:var(--surface); border:2px solid var(--line); border-radius:var(--radius-lg);
    padding:18px; text-align:center; transition:transform .12s ease, border-color .12s ease;}
  .profile-card:hover{transform:translateY(-3px); border-color:var(--accent);}
  .profile-avatar{ width:72px; height:72px; border-radius:50%; margin:0 auto 10px; font-size:36px;
    display:flex; align-items:center; justify-content:center; background:var(--surface-2); border:2px solid var(--line);}
  .profile-card h3{font-size:17px;}
  .profile-card .meta{color:var(--ink-soft); font-size:13px; margin:4px 0 14px;}
  .profile-card-actions{display:flex; gap:8px; justify-content:center;}
  .add-profile-card{ border:2px dashed var(--line); border-radius:var(--radius-lg); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:8px; padding:18px; color:var(--ink-soft); background:transparent;
    min-height:196px; font-weight:700;}
  .add-profile-card:hover{border-color:var(--accent); color:var(--accent);}
  .add-profile-card .plus{font-size:34px; color:var(--accent);}

  /* ---------- Config view ---------- */
  .config-grid{display:grid; grid-template-columns:1.1fr 1fr; gap:18px;}
  @media (max-width:820px){ .config-grid{grid-template-columns:1fr;} }
  .field{margin-bottom:16px;}
  .field label{display:block; font-weight:700; font-size:14px; margin-bottom:6px;}
  .field input[type=text], .field input[type=number], .field select{ width:100%; padding:10px 12px; border:2px solid var(--line);
    border-radius:10px; font-family:inherit; font-size:15px; background:var(--surface-2);}
  .field input:focus, .field select:focus{outline:none; border-color:var(--accent);}
  .theme-options, .avatar-options{display:flex; flex-wrap:wrap; gap:8px;}
  .chip-option{ border:2px solid var(--line); border-radius:12px; padding:9px 12px; background:var(--surface-2);
    font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px;}
  .chip-option.selected{border-color:var(--accent); background:#EDE9FC; color:var(--accent);}
  .avatar-options .chip-option{font-size:22px; padding:6px 10px;}
  .grid-size-options{display:flex; gap:8px; flex-wrap:wrap;}
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); gap:10px;}
  .toggle-row:last-child{border-bottom:none;}
  .toggle-row .trow-text{font-size:14.5px;}
  .toggle-row .trow-sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .switch{position:relative; width:44px; height:26px; flex:0 0 auto;}
  .switch input{opacity:0; width:0; height:0;}
  .slider-track{position:absolute; inset:0; background:#D9D4EF; border-radius:999px; transition:.15s;}
  .slider-track:before{content:""; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .switch input:checked + .slider-track{background:var(--accent);}
  .switch input:checked + .slider-track:before{transform:translateX(18px);}
  .range-row{display:flex; align-items:center; gap:12px;}
  .range-row input[type=range]{flex:1;}
  .custom-word-form{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end;}
  .custom-word-form .field{margin-bottom:0; flex:1; min-width:110px;}
  .word-list{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .word-chip{display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:6px 10px; font-size:14px; font-weight:700;}
  .word-chip button{background:none; border:none; color:#B23A34; font-weight:800;}
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:10px; margin-top:10px;}
  .stat-box{background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center;}
  .stat-box .num{font-family:'Baloo 2'; font-size:22px; font-weight:800; color:var(--accent);}
  .stat-box .lbl{font-size:11.5px; color:var(--ink-soft); font-weight:700;}
  .save-bar{display:flex; justify-content:flex-end; gap:10px; margin-top:18px; flex-wrap:wrap;}
  .cat-groups{display:flex; flex-direction:column; gap:4px;}
  .cat-group-label{font-size:12px; text-transform:none; color:var(--ink-soft); font-weight:800; margin:14px 0 2px;}

  /* ---------- Board view ---------- */
  .sentence-strip{ background:var(--surface); border:2px solid var(--line); border-radius:var(--radius-lg);
    padding:14px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; min-height:74px; box-shadow:var(--shadow-1);}
  .sentence-strip .empty-hint{color:var(--ink-soft); font-size:15px;}
  .sentence-word{ background:var(--surface-2); border:2px solid var(--line); border-radius:12px; padding:8px 12px;
    font-family:'Baloo 2'; font-weight:700; font-size:17px; display:flex; align-items:center; gap:8px;}
  .sentence-word .emoji{font-size:20px;}
  .sentence-actions{display:flex; gap:8px; margin-left:auto; flex-wrap:wrap;}
  .round-action{ border:none; border-radius:14px; padding:12px 18px; font-family:'Baloo 2'; font-weight:700; font-size:16px;
    display:flex; align-items:center; gap:8px; color:#fff;}
  .round-action.speak{background:var(--accent);}
  .round-action.clear{background:#E8574F;}
  .round-action.back{background:var(--ink-soft);}

  .search-bar{ position:relative; display:flex; align-items:center; margin:16px 0 4px;}
  .search-bar .search-icon{ position:absolute; left:16px; font-size:20px; pointer-events:none;}
  .search-input{ width:100%; border:2px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:999px; padding:14px 52px 14px 50px; font-size:18px; font-family:'Baloo 2'; font-weight:600; box-shadow:var(--shadow-1);}
  .search-input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 4px rgba(110,93,224,.18);}
  .search-clear{ position:absolute; right:8px; width:40px; height:40px; border-radius:50%; border:none;
    background:var(--surface-2); color:var(--ink-soft); font-size:18px; font-weight:800; cursor:pointer;}
  .search-count{ color:var(--ink-soft); font-size:14px; margin:6px 6px 10px;}
  .search-empty{ text-align:center; padding:28px 12px; color:var(--ink-soft); font-size:16px;}
  .picto-btn .cat-hint{ font-size:11px; font-weight:700; opacity:.75; margin-top:-2px;}
  img.emoji.sym-img{ width:1.6em; height:1.6em; border-radius:12px; background:#fff; object-fit:contain; vertical-align:middle; }
  img.emoji.sym-photo{ object-fit:cover; }
  .sentence-word img.emoji.sym-img{ width:1.5em; height:1.5em; border-radius:8px; }
  .style-pick{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin:14px 0;}
  .style-opt{ text-align:left; border:3px solid var(--line); background:var(--surface); color:var(--ink); border-radius:18px; padding:14px; cursor:pointer; font-family:inherit;}
  .style-opt.active{ border-color:var(--accent); box-shadow:0 0 0 4px rgba(110,93,224,.18);}
  .style-emoji{ font-size:34px;} .style-title{ font-family:'Baloo 2'; font-weight:800; font-size:17px; margin-top:4px;}
  .style-desc{ font-size:13px; color:var(--ink-soft); margin-top:4px;} .style-count{ font-size:12px; font-weight:800; color:var(--accent); margin-top:6px;}
  .bulk-row{ display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .file-type-sel{ border:2px solid var(--line); border-radius:999px; padding:8px 12px; font-family:inherit; background:var(--surface); color:var(--ink);}
  .only-missing{ display:block; margin:8px 0; font-size:14px; color:var(--ink-soft);}
  .img-row{ display:grid; grid-template-columns:1.2fr auto 1.4fr; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line);}
  .img-word .emoji{ height:1.2em; width:1.2em; vertical-align:-0.2em;} .img-previews{ display:flex; gap:10px; text-align:center;}
  .img-thumb{ width:56px; height:56px; object-fit:contain; border-radius:10px; background:#fff; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink-soft);}
  .img-actions{ display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end;}
  @media (max-width:640px){ .img-row{ grid-template-columns:1fr; } .img-actions{ justify-content:flex-start; } }
  .mod-back{ position:fixed; inset:0; background:rgba(20,16,40,.55); z-index:9999; display:flex; align-items:center; justify-content:center; padding:14px;}
  .mod-card{ background:var(--surface); color:var(--ink); border-radius:22px; max-width:760px; width:100%; max-height:90vh; overflow:auto; padding:20px; box-shadow:0 20px 60px rgba(0,0,0,.4);}
  .arasaac-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px; margin-top:8px;}
  .arasaac-item{ border:2px solid var(--line); background:#fff; border-radius:14px; padding:6px; cursor:pointer;} .arasaac-item:hover{ border-color:var(--accent);} .arasaac-item img{ width:100%; aspect-ratio:1/1; object-fit:contain; display:block;}
  .tpl-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px;}
  .tpl-card{ border:2px solid var(--line); border-radius:18px; padding:14px; background:var(--surface-2);} .tpl-title{ font-family:'Baloo 2'; font-weight:800; font-size:17px;}
  .board-msg{ margin:10px 0; padding:10px 14px; border-radius:14px; background:var(--surface-2); font-weight:700;}
  .exp-list{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:4px 12px; margin:8px 0;} .exp-item{ font-size:14px;}
  .cat-block{ border:2px solid var(--line); border-radius:16px; padding:12px; margin:10px 0;}
  .cat-head{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between;} .cat-actions{ display:flex; gap:6px; align-items:center;}
  .aac-stairs{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:14px 0;}
  .aac-step{ border:3px solid var(--line); background:var(--surface); color:var(--ink); border-radius:16px; padding:10px 6px; cursor:pointer; text-align:center; font-family:inherit;}
  .aac-step.current{ border-color:var(--accent); background:var(--surface-2); box-shadow:0 0 0 4px rgba(110,93,224,.18);} .aac-step.done{ opacity:.75;}
  .aac-step-n{ font-size:22px;} .aac-step-t{ font-family:'Baloo 2'; font-weight:800; font-size:14px;} .aac-step-s{ font-size:11px; color:var(--ink-soft); line-height:1.2;}
  @media (max-width:560px){ .aac-stairs{ grid-template-columns:repeat(5,minmax(60px,1fr)); gap:4px;} .aac-step-s{ display:none; } }
  .aac-card{ margin-top:14px;} .aac-card.current{ border:3px solid var(--accent);}
  .aac-card-head{ display:flex; justify-content:space-between; align-items:center; cursor:pointer; gap:10px;} .aac-chevron{ font-size:16px; color:var(--ink-soft);}
  .aac-metric{ margin:8px 0;} .aac-metric-row{ display:flex; justify-content:space-between; gap:10px; font-size:14px; margin-bottom:4px;}
  .aac-bar{ height:12px; background:var(--surface-2); border-radius:8px; overflow:hidden; border:1px solid var(--line);}
  .aac-bar-fill{ height:100%; background:var(--accent); border-radius:8px; -webkit-print-color-adjust:exact; print-color-adjust:exact;} .aac-bar-fill.done{ background:#4CAF50;}
  .aac-check{ display:block; padding:4px 0; font-size:15px;}
  .note-form{ border:2px solid var(--line); border-radius:18px; padding:14px; margin-top:12px; background:var(--surface-2);}
  .note-day{ font-family:'Baloo 2'; font-weight:800; font-size:17px; margin:18px 0 6px; padding-bottom:4px; border-bottom:2px solid var(--line); text-transform:capitalize;}
  .note-card{ border:2px solid var(--line); border-radius:14px; padding:10px 12px; margin:8px 0; background:var(--surface);}
  .note-text{ font-size:16px; margin-top:6px; white-space:pre-wrap; overflow-wrap:anywhere;}
  .note-tags{ display:flex; flex-wrap:wrap; gap:6px;}
  .note-tag{ font-size:12px; font-weight:800; padding:3px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line);} .note-tag.how{ font-weight:600; color:var(--ink-soft);}
  .goal-head{ display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;} .goal-title{ font-family:'Baloo 2'; font-weight:800; font-size:18px;}
  .goal-progress{ margin:8px 0;} .goal-actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .note-actions{ display:flex; gap:8px; margin-top:8px;}
  .note-row{ display:grid; grid-template-columns:90px 1fr; gap:10px; padding:6px 0; border-bottom:1px solid var(--line);} .note-date{ font-size:13px; color:var(--ink-soft); font-weight:700;}
  .sb-box{ margin:2px 0 6px;}
  .sb-frame{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:2px 0 8px;}
  .sb-slot{ font-size:13px; font-weight:800; padding:4px 12px; border-radius:999px; border:2px solid var(--line); background:var(--surface); color:var(--ink-soft);}
  .sb-slot.done{ background:#E3F6DF; border-color:#7BC24A; color:#2E6B1F;} .sb-slot.now{ border-color:var(--accent); color:var(--accent); background:#EDE9FC;}
  .sb-ready{ font-size:13px; font-weight:800; color:#2E6B1F;}
  .prediction-chip.personal{ border-style:solid; background:#FFF4D6; color:#8A5A00; border-color:#F2B63C;}
  .msg-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; margin-top:16px;}
  .msg-card{ border:3px solid var(--mc,#6E5DE0); background:var(--surface); color:var(--ink); border-radius:22px; padding:14px 10px 12px; cursor:pointer; font-family:inherit; box-shadow:var(--shadow-1); transition:transform .08s;}
  .msg-card:active{ transform:scale(.97);} .msg-card .msg-text-line{ color:var(--mc,#6E5DE0);}
  .msg-visual{ display:flex; flex-direction:column; align-items:center; gap:8px; min-width:0;}
  .msg-tiles{ display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-start; gap:6px;}
  .msg-tile{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:58px; max-width:96px;}
  .msg-tile .emoji{ font-size:40px; line-height:1.1;} .msg-tile img.emoji{ font-size:40px;}
  .msg-tile.whole{ max-width:none;} .msg-whole-img{ width:150px; height:150px; object-fit:contain; border-radius:16px; background:#fff;}
  .msg-cap{ font-size:12px; font-weight:700; color:var(--ink-soft); text-align:center; line-height:1.15; margin-top:2px; overflow-wrap:anywhere;}
  .msg-plus{ align-self:center; color:var(--ink-soft); font-weight:800; opacity:.55; margin-top:-14px;}
  .msg-textonly{ border:2px dashed var(--line); border-radius:12px; padding:8px 10px; font-weight:800; font-size:14px; background:var(--surface-2);}
  .msg-text-line{ font-family:'Baloo 2'; font-weight:800; font-size:17px; text-align:center; line-height:1.2;}
  .msg-visual.compact .msg-tiles{ flex-wrap:nowrap; gap:2px;} .msg-visual.compact .msg-tile{ min-width:0;} .msg-visual.compact .msg-tile .emoji{ font-size:22px;} .msg-visual.compact .msg-tile img.emoji{ font-size:22px;}
  .msg-visual.compact .msg-textonly{ font-size:11px; padding:2px 6px;} .msg-visual.compact .msg-whole-img{ width:34px; height:34px; border-radius:8px;}
  .msg-edit-card .msg-visual.compact{ min-width:90px;} .pinned-chip .msg-visual{ display:inline-flex; vertical-align:middle;}
  body[data-style="adulto"]{ --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#1F2933; --ink-soft:#56616B; --line:#D5DAE0; --accent:#2F5D8A; --amber:#B7791F;
    --radius-lg:12px; --radius-md:8px; --shadow-1:none;
    --cat-people:#B89B3E; --cat-people-ink:#1F1A00; --cat-verb:#4E7F52; --cat-emo:#A5584B; --cat-desc:#3F7BA6; --cat-noun:#A9692F; --cat-higiene:#2F827D; --cat-aseo:#506F99;
    --cat-vestirse:#8A6D2D; --cat-vestirse-ink:#FFFFFF; --cat-school:#4A5BA8; --cat-church:#765083; --cat-home:#8C5E3A; --cat-colores:#7B5BA8; --cat-figuras:#5F6F86; --cat-dinero:#3C8453;

  body[data-style="adulto"]{ --accent:#3F5E8C; --radius-lg:14px; --radius-md:10px; }
  body[data-style="adulto"]::before{ opacity:.25; filter:blur(80px);}
  .mascot-avatar{ touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none; }
  .mascot-avatar:hover{ filter:brightness(1.08); }
  .mascot-widget.mascot-dragging{ transition:none; z-index:70; }
  .mascot-widget.mascot-dragging .mascot-avatar{ cursor:grabbing; animation:none; transform:scale(1.14) rotate(-5deg);
    box-shadow:0 20px 36px -8px rgba(43,38,64,.55), 0 0 0 7px rgba(255,255,255,.75); }
  .mascot-avatar.mascot-hover{ animation:mascot-hover-wave .6s ease-in-out infinite alternate; }
  .mascot-avatar.mascot-react-jump{ animation:mascot-react-jump .85s cubic-bezier(.3,1.6,.5,1); }
  .mascot-avatar.mascot-react-spin{ animation:mascot-react-spin .9s ease-in-out; }
  .mascot-avatar.mascot-react-wiggle{ animation:mascot-react-wiggle .85s ease-in-out; }
  .mascot-avatar.mascot-react-dance{ animation:mascot-react-dance 1s ease-in-out; }
  @keyframes mascot-hover-wave{ from{transform:scale(1.1) rotate(-9deg);} to{transform:scale(1.15) rotate(9deg);} }
  @keyframes mascot-react-jump{ 0%{transform:translateY(0) scale(1);} 35%{transform:translateY(-44px) scale(1.2,.9);} 55%{transform:translateY(0) scale(.9,1.12);} 75%{transform:translateY(-14px) scale(1.05);} 100%{transform:translateY(0) scale(1);} }
  @keyframes mascot-react-spin{ 0%{transform:rotate(0) scale(1);} 50%{transform:rotate(200deg) scale(1.25);} 100%{transform:rotate(360deg) scale(1);} }
  @keyframes mascot-react-wiggle{ 0%,100%{transform:rotate(0);} 15%{transform:rotate(-16deg) scale(1.1);} 35%{transform:rotate(14deg);} 55%{transform:rotate(-10deg);} 75%{transform:rotate(8deg);} }
  @keyframes mascot-react-dance{ 0%{transform:translate(0,0) rotate(0);} 20%{transform:translate(-14px,-12px) rotate(-12deg) scale(1.1);} 40%{transform:translate(14px,0) rotate(12deg);} 60%{transform:translate(-12px,-16px) rotate(-10deg) scale(1.12);} 80%{transform:translate(10px,0) rotate(8deg);} 100%{transform:translate(0,0) rotate(0);} }
  @keyframes mascot-react-calm{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
  body[data-intensity="calmado"] .mascot-avatar[class*="mascot-react-"]{ animation:mascot-react-calm .6s ease; }
  body[data-intensity="calmado"] .mascot-avatar.mascot-hover{ animation:none; transform:scale(1.05); }
  .mascot-heart{ position:fixed; pointer-events:none; z-index:65; font-size:24px; animation:mascot-heart-rise 1.3s ease-out forwards; opacity:0; }
  @keyframes mascot-heart-rise{ 0%{transform:translate(0,0) scale(.5); opacity:0;} 15%{opacity:1;} 100%{transform:translate(var(--dx),-100px) scale(1.25); opacity:0;} }
  .mascot-reaction-pop{ position:absolute; right:6px; top:-8px; font-size:30px; pointer-events:none;

  @keyframes mascot-reaction-rise{ 0%{transform:translateY(0) scale(.6); opacity:0;} 25%{opacity:1; transform:translateY(-10px) scale(1.15);} 100%{transform:translateY(-46px) scale(1); opacity:0;} }

  .achievement-toast{ position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:70;
    background:linear-gradient(135deg,#7C3AED,#EC4899); color:#fff; padding:14px 22px; border-radius:18px;
    font-family:'Baloo 2'; font-weight:800; font-size:15px; box-shadow:0 12px 28px -10px rgba(0,0,0,.4);
    display:flex; align-items:center; gap:10px; animation:toast-in .4s ease;}
  .achievement-toast .emoji{font-size:26px;}
  @keyframes toast-in{ from{transform:translateX(-50%) translateY(-30px); opacity:0;} to{transform:translateX(-50%) translateY(0); opacity:1;} }

  /* ---------- Logros ---------- */
  .achv-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; margin-top:16px;}
  .achv-card{ border:2px solid var(--line); border-radius:16px; padding:16px; text-align:center; background:var(--surface);}
  .achv-card.locked{ opacity:.45; filter:grayscale(1);}
  .achv-card .emoji{font-size:36px; display:block; margin-bottom:8px;}
  .achv-card .title{font-family:'Baloo 2'; font-weight:700; font-size:13.5px;}

  /* ---------- Predicción de palabras ---------- */
  .prediction-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:2px 0 14px;}
  .prediction-label{font-size:12.5px; color:var(--ink-soft); font-weight:700;}
  .prediction-chip{ border:2px dashed var(--accent); background:#EDE9FC; color:var(--accent); border-radius:999px;
    padding:7px 13px; font-weight:700; font-size:13.5px; display:flex; align-items:center; gap:6px;}

  /* ---------- Comunicación rápida (emergencias) ---------- */
  .quick-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-top:16px;}
  .quick-btn{ border:none; border-radius:20px; padding:22px 10px; background:#E0645C; color:#fff;
    display:flex; flex-direction:column; align-items:center; gap:10px; box-shadow:0 8px 20px -8px rgba(224,100,92,.6);}
  .quick-btn .emoji{font-size:44px;}
  .quick-btn .label{font-family:'Baloo 2'; font-weight:800; font-size:15px; text-align:center;}

  /* ---------- Historias interactivas ---------- */
  .story-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; margin-top:16px;}
  .story-card{ background:var(--surface); border:2px solid var(--line); border-radius:var(--radius-lg); padding:20px; text-align:left;}
  .story-card .s-emoji{font-size:40px; display:block; margin-bottom:8px;}
  .story-card h3{font-size:17px; margin-bottom:6px;}
  .story-card p{font-size:13.5px; color:var(--ink-soft); margin:0 0 14px; line-height:1.4;}
  .story-scene{ background:var(--surface); border:2px solid var(--line); border-radius:var(--radius-lg); padding:26px 20px; text-align:center; margin-bottom:18px;}
  .story-scene .s-emoji{font-size:60px; display:block; margin-bottom:10px;}
  .story-scene .s-text{font-family:'Baloo 2'; font-weight:700; font-size:19px; margin-bottom:4px;}
  .story-sentence{ background:var(--surface-2); border:2px dashed var(--line); border-radius:16px; padding:12px 16px;
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center; min-height:56px; align-items:center; margin-bottom:18px;}
  .story-options{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; max-width:640px; margin:0 auto;}
  .story-option{ border:3px solid var(--line); background:var(--surface); border-radius:var(--radius-lg); padding:18px 10px;
    display:flex; flex-direction:column; align-items:center; gap:8px; min-height:110px;}
  .story-option .emoji{font-size:38px;}
  .story-option .label{font-family:'Baloo 2'; font-weight:700; font-size:14px; text-align:center;}
  @media (max-width:640px){
    .mascot-widget{right:10px; bottom:10px; max-width:220px;}
    .mascot-bubble{font-size:12.5px; padding:8px 12px; max-width:140px;}
    .mascot-avatar{width:80px;height:80px;font-size:44px;}
  }

  /* ---------- Confeti de festejo ---------- */
  .confetti-row{display:flex; gap:6px; justify-content:center; margin-top:6px;}
  .confetti-piece{display:inline-block; font-size:20px; animation:confetti-pop .6s ease forwards; opacity:0;}
  @keyframes confetti-pop{0%{transform:translateY(6px) scale(.3) rotate(0deg); opacity:0;}55%{opacity:1;}100%{transform:translateY(-14px) scale(1) rotate(12deg); opacity:1;}}

  /* ---------- Paginación del tablero ---------- */
  .board-pager{display:flex; align-items:center; justify-content:center; gap:14px; margin-top:14px;}
  .board-pager button{ border:2px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 16px; font-weight:700;}
  .board-pager button[disabled]{opacity:.4; pointer-events:none;}
  .board-pager .page-info{font-size:13px; color:var(--ink-soft); font-weight:700;}

  /* ---------- Reporte imprimible ---------- */
  .report-card{max-width:760px; margin:0 auto;}
  .report-head{display:flex; align-items:center; gap:16px; border-bottom:2px solid var(--line); padding-bottom:16px; margin-bottom:16px;}
  .report-head .avatar{width:64px; height:64px; border-radius:50%; background:var(--surface-2); border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:32px;}
  .report-head h2{font-size:22px; font-weight:800;}
  .report-head .sub{color:var(--ink-soft); font-size:13.5px;}
  .report-section{margin-bottom:20px;}
  .report-section h4{font-size:14.5px; font-weight:800; margin-bottom:8px; color:var(--accent);}
  .report-table{width:100%; border-collapse:collapse;}
  .report-table td{padding:8px 6px; border-bottom:1px solid var(--line); font-size:14px;}
  .report-table td:first-child{color:var(--ink-soft); width:60%;}
  .report-table td:last-child{font-weight:800; text-align:right; font-family:'Baloo 2';}
  .report-tags{display:flex; flex-wrap:wrap; gap:6px;}
  .report-charts{display:flex; gap:28px; align-items:center; flex-wrap:wrap; justify-content:flex-start;}
  .report-tag{background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-size:12.5px; font-weight:700;}
  .report-notes textarea{width:100%; min-height:90px; border:2px solid var(--line); border-radius:12px; padding:10px 12px;
    font-family:inherit; font-size:14px; background:var(--surface-2); resize:vertical;}
  .report-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:10px;}

  @media print{
    body{background:#fff;}
    .no-print{display:none !important;}
    #app{max-width:100%; padding:0;}
    .report-card{box-shadow:none; border:none; padding:0;}
  }
  /* ---------- Avatar personalizable ---------- */
  .avatar-preview{ width:120px; height:120px; border-radius:50%; background:var(--surface-2); border:3px solid var(--line); overflow:hidden; margin:6px 0 12px;}
  .avatar-group{margin-bottom:10px;}
  .avatar-group-label{font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:5px;}
  .swatch-row{display:flex; gap:8px; flex-wrap:wrap;}
  .swatch{ width:34px; height:34px; border-radius:50%; border:3px solid var(--line); padding:0;}
  .swatch.selected{ border-color:var(--accent); box-shadow:0 0 0 3px #EDE9FC;}
  .profile-avatar{overflow:hidden;}
  .top-avatar{ width:38px; height:38px; border-radius:50%; overflow:hidden; background:var(--surface-2); border:2px solid var(--line); align-self:center; flex:0 0 auto;}
  .lb-avatar{ display:inline-flex; width:22px; height:22px; border-radius:50%; overflow:hidden; background:#fff; vertical-align:middle;}
  .toast-avatar{ display:inline-flex; width:34px; height:34px; border-radius:50%; overflow:hidden; background:#fff; flex:0 0 auto;}

  /* ---------- Memotest ---------- */
  .memo-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(92px,1fr)); gap:12px; max-width:640px; margin:0 auto 14px;}
  .memo-card{ aspect-ratio:1/1; min-height:92px; border:3px solid var(--line); border-radius:16px;
    background:linear-gradient(135deg,#7C3AED,#EC4899); color:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow-1); padding:4px;}
  .memo-card .mback{font-size:34px;}
  .memo-card .emoji{font-size:40px;}
  .memo-card .mlabel{font-family:'Baloo 2'; font-weight:800; font-size:15px; text-align:center; line-height:1.1;}
  .memo-card.up{ background:var(--surface); color:var(--ink); animation:memo-pop .3s ease;}
  .memo-card.matched{ background:#EAF7EC; border-color:#4CAF50;}
  .memo-card[disabled]{ cursor:default;}
  @keyframes memo-pop{ 0%{transform:scale(.8) rotateY(90deg);} 100%{transform:scale(1) rotateY(0);} }

  /* ---------- Modo sensorial ALTO: confeti y mascota hiperactiva / modo CALMADO: sin movimiento ---------- */
  .fall-layer{ position:fixed; inset:0; z-index:65; pointer-events:none; overflow:hidden;}
  .fall-piece{ position:absolute; top:-40px; animation-name:fall-down; animation-timing-function:ease-in; animation-fill-mode:forwards;}
  @keyframes fall-down{ 0%{transform:translateY(0) rotate(0); opacity:1;} 100%{transform:translateY(110vh) rotate(420deg); opacity:.85;} }
  body[data-intensity="alto"] .mascot-avatar{ animation-duration:.9s; }
  body[data-intensity="calmado"] .mascot-avatar{ animation:none; }
  body[data-intensity="calmado"] .mascot-widget{ transition:none; }
</style>

// ---------- Vocabulario núcleo ----------
// ---------- Almacenamiento: usa el almacenamiento de Claude si está disponible (vista previa),
// y si no (app instalada en el celular, fuera de Claude), guarda todo localmente con IndexedDB. ----------
const LocalDB = (function(){
  let dbPromise = null;
  function openDB(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject)=>{
      if(!('indexedDB' in window)){ reject(new Error('IndexedDB no disponible')); return; }
      const req = indexedDB.open('comunica-plus-db', 1);
      req.onupgradeneeded = ()=>{ req.result.createObjectStore('kv'); };
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error);
    });
    return dbPromise;
  }
  async function get(key){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction('kv','readonly');
      const req = tx.objectStore('kv').get(key);
      req.onsuccess = ()=>{
        if(req.result===undefined) reject(new Error('not found'));
        else resolve({ key, value:req.result, shared:false });
      };
      req.onerror = ()=>reject(req.error);
    });
  }
  async function set(key, value){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction('kv','readwrite');
      tx.objectStore('kv').put(value, key);
      tx.oncomplete = ()=>resolve({ key, value, shared:false });
      tx.onerror = ()=>reject(tx.error);
    });
  }
  async function del(key){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction('kv','readwrite');
      tx.objectStore('kv').delete(key);
      tx.oncomplete = ()=>resolve({ key, deleted:true, shared:false });
      tx.onerror = ()=>reject(tx.error);
    });
  }
  async function list(prefix){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const req = db.transaction('kv','readonly').objectStore('kv').getAllKeys();
      req.onsuccess = ()=>{
        let keys = req.result.map(String);
        if(prefix) keys = keys.filter(k=>k.startsWith(prefix));
        resolve({ keys });
      };
      req.onerror = ()=>reject(req.error);
    });
  }
  return { get, set, delete:del, list };
})();

function firstName(fullName){ const n=(fullName||'').trim(); if(!n || /^nuevo perfil$/i.test(n)) return ''; return n.split(/\s+/)[0]; }
// Elige una frase para la mascota: si el perfil tiene nombre cargado, mezcla frases genéricas con frases
// que lo llaman por su nombre; si no hay nombre, usa solo las genéricas.
function pickMascotPhrase(p, mood){
  p = p || (state.currentId ? state.profilesCache[state.currentId] : null);
  if(mood==='greet'){
    const nm = p ? firstName(p.name) : '';
    const g = nm ? ['¡Hola, '+nm+'! 👋 ¿Jugamos?', '¡Qué alegría verte, '+nm+'! 💜', '¡Hola '+nm+'! Estoy listo para jugar 🎉']
                 : ['¡Hola! 👋 ¿Jugamos?', '¡Qué alegría verte! 💜'];
    return g[Math.floor(Math.random()*g.length)];
  }
  const base = mood==='good' ? MASCOT_GOOD : mood==='bad' ? MASCOT_BAD : MASCOT_IDLE;
  const name = p ? firstName(p.name) : '';
  if(!name) return base[Math.floor(Math.random()*base.length)];
  const named = (mood==='good' ? MASCOT_GOOD_NAME : mood==='bad' ? MASCOT_BAD_NAME : MASCOT_IDLE_NAME).map(t=>t.replace('{name}', name));
  const pool = base.concat(named);
  return pool[Math.floor(Math.random()*pool.length)];
}

// Registra, por perfil y solo en este dispositivo, qué palabras y frases se usaron, cuántas veces y a qué hora.
// Cuenta el uso real (tablero, buscador, ideas, mensajes y Ayuda rápida); NO cuenta los juegos de práctica.
function ensureUsageLog(p){
  if(!p.usageLog || typeof p.usageLog!=='object') p.usageLog = {};
  const u = p.usageLog;
  u.words = u.words || {};
  u.phrases = u.phrases || {};
  if(!Array.isArray(u.hours) || u.hours.length!==24) u.hours = new Array(24).fill(0);
  if(!Array.isArray(u.wdays) || u.wdays.length!==7) u.wdays = new Array(7).fill(0);
  u.daily = u.daily || {};
  u.recent = Array.isArray(u.recent) ? u.recent : [];
  if(!u.since) u.since = Date.now();
  return u;
}
function histDayKey(d){ const m=d.getMonth()+1, day=d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day; }
function histTouch(u, now){
  const d = new Date(now);
  u.hours[d.getHours()] += 1;
  u.wdays[d.getDay()] += 1;
  const k = histDayKey(d);
  u.daily[k] = (u.daily[k]||0) + 1;
  const keys = Object.keys(u.daily);
  if(keys.length > 150){ keys.sort(); keys.slice(0, keys.length-120).forEach(x=>delete u.daily[x]); }
}
function recordWordUse(p, w){
  try{
    if(!w || !w.label) return;
    const u = ensureUsageLog(p), now = Date.now(), key = normalizeWord(w.label);
    if(!key) return;
    const e = u.words[key] || (u.words[key] = { l:w.label, e:w.emoji||'', n:0, t:0, h:new Array(24).fill(0) });
    e.n += 1; e.t = now; e.l = w.label; if(w.emoji) e.e = w.emoji;
    if(!Array.isArray(e.h) || e.h.length!==24) e.h = new Array(24).fill(0);
    e.h[new Date(now).getHours()] += 1;
    histTouch(u, now);
    u.recent.unshift([now,'w',w.label,w.emoji||'']);
    if(u.recent.length > 200) u.recent.length = 200;
    goalsOnWord(p, w.label);
  }catch(err){}
}
// kind: 'f' = frase armada y hablada, 'm' = mensaje completo
function recordPhraseUse(p, text, emoji, kind, items, labels){
  try{
    const u = ensureUsageLog(p), now = Date.now(), key = kind+'|'+normalizeWord(text);
    if(!normalizeWord(text)) return;
    const e = u.phrases[key] || (u.phrases[key] = { x:text, e:emoji||'', k:kind, n:0, t:0 });
    e.n += 1; e.t = now; if(items) e.c = items; if(Array.isArray(labels) && labels.length) e.l = labels.slice(0,12).map(x=>String(x).slice(0,60));
    const keys = Object.keys(u.phrases);
    if(keys.length > 300){
      keys.sort((a,b)=> (u.phrases[a].n-u.phrases[b].n) || (u.phrases[a].t-u.phrases[b].t));
      keys.slice(0, keys.length-300).forEach(k=>delete u.phrases[k]);
    }
    u.recent.unshift([now,kind,text,emoji||'']);
    if(u.recent.length > 200) u.recent.length = 200;
    goalsOnPhrase(p, text, items || String(text).trim().split(/\s+/).length);
  }catch(err){}
}

function histPad(n){ return n<10 ? '0'+n : String(n); }
function histHourRange(h){ return histPad(h)+' a '+histPad((h+1)%24)+' h'; }
function histPeakHour(arr){ let b=-1, m=0; (arr||[]).forEach((v,i)=>{ if(v>m){ m=v; b=i; } }); return b; }
function fmtWhen(ts){
  if(!ts) return '—';
  const d = new Date(ts), now = new Date();
  const hm = histPad(d.getHours())+':'+histPad(d.getMinutes());
  const y = new Date(now); y.setDate(now.getDate()-1);
  if(histDayKey(d)===histDayKey(now)) return 'hoy '+hm;
  if(histDayKey(d)===histDayKey(y)) return 'ayer '+hm;
  return histPad(d.getDate())+'/'+histPad(d.getMonth()+1)+' '+hm;
}
function histStats(p){
  const u = ensureUsageLog(p);
  const words = Object.values(u.words).sort((a,b)=> b.n-a.n || b.t-a.t);
  const phrases = Object.values(u.phrases).sort((a,b)=> b.n-a.n || b.t-a.t);
  const totalWords = words.reduce((s,w)=>s+w.n,0);
  const totalPhrases = phrases.reduce((s,f)=>s+f.n,0);
  const now = new Date(); let today = 0, week = 0;
  for(let i=0;i<7;i++){ const d=new Date(now); d.setDate(now.getDate()-i); const n=u.daily[histDayKey(d)]||0; week+=n; if(i===0) today=n; }
  const totalHours = u.hours.reduce((s,v)=>s+v,0);
  return { u, words, phrases, totalWords, totalPhrases, today, week, totalHours };
}
// Gráfico de barras simple (SVG, se imprime bien)
function histBarsSVG(values, labels, opts={}){
  const color = opts.color || '#6E5DE0', every = opts.every || 1;
  const W = 480, H = 130, padB = 22, padT = 16, n = values.length;
  const max = Math.max(1, ...values), slot = W/n, bw = Math.max(4, slot*0.7);
  let g = '';
  values.forEach((v,i)=>{
    const h = Math.round((v/max)*(H-padB-padT));
    const x = i*slot + (slot-bw)/2, y = H-padB-h;
    g += `<rect x="${x.toFixed(1)}" y="${y}" width="${bw.toFixed(1)}" height="${Math.max(h, v>0?2:0)}" rx="3" fill="${color}"/>`;
    if(v>0 && (v===max)) g += `<text x="${(x+bw/2).toFixed(1)}" y="${y-4}" text-anchor="middle" font-size="11" font-weight="700" fill="#2B2640" font-family="Baloo 2,sans-serif">${v}</text>`;
    if(i%every===0) g += `<text x="${(x+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="#6B6585" font-family="Atkinson Hyperlegible,sans-serif">${labels[i]}</text>`;
  });
  g += `<line x1="0" y1="${H-padB}" x2="${W}" y2="${H-padB}" stroke="#D9D3EE" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;">${g}</svg>`;
}

function csvCell(v){ const s = String(v==null?'':v); return /[";\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function exportHistoryCSV(p){
  const st = histStats(p);
  const fmtFull = ts => { if(!ts) return ''; const d=new Date(ts); return histPad(d.getDate())+'/'+histPad(d.getMonth()+1)+'/'+d.getFullYear()+' '+histPad(d.getHours())+':'+histPad(d.getMinutes()); };
  const rows = [];
  rows.push(['Palabras más usadas']);
  rows.push(['Palabra','Usos','Porcentaje','Hora habitual','Última vez']);
  st.words.forEach(w=>{ const ph=histPeakHour(w.h); rows.push([w.l, w.n, st.totalWords?(100*w.n/st.totalWords).toFixed(1).replace('.',',')+'%':'', ph>=0?histHourRange(ph):'', fmtFull(w.t)]); });
  rows.push([]);
  rows.push(['Frases y mensajes más usados']);
  rows.push(['Frase','Tipo','Usos','Última vez']);
  st.phrases.forEach(f=> rows.push([f.x, f.k==='m'?'Mensaje':'Frase armada', f.n, fmtFull(f.t)]));
  rows.push([]);
  rows.push(['Uso por hora del día']);
  rows.push(['Hora','Usos']);
  st.u.hours.forEach((n,h)=> rows.push([histHourRange(h), n]));
  rows.push([]);
  rows.push(['Uso por día']);
  rows.push(['Fecha','Usos']);
  Object.keys(st.u.daily).sort().forEach(k=> rows.push([k, st.u.daily[k]]));
  rows.push([]);
  rows.push(['Últimos movimientos']);
  rows.push(['Fecha y hora','Tipo','Texto']);
  st.u.recent.forEach(r=> rows.push([fmtFull(r[0]), r[1]==='w'?'Palabra':(r[1]==='m'?'Mensaje':'Frase'), r[2]]));
  const csv = '\uFEFF' + rows.map(r=> r.map(csvCell).join(';')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeName = (p.name||'perfil').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-') || 'perfil';
  a.href = url; a.download = `comunica_historial_${safeName}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function recordPhrase(p, words){
  const n = words.length, pr = p.progress;
  pr.phraseWordsTotal = (pr.phraseWordsTotal||0) + n;
  if(n > (pr.phraseMaxLen||0)) pr.phraseMaxLen = n;
  pr.phrasesSpoken = (pr.phrasesSpoken||0) + 1;
  if(n >= 2) pr.multiWordPhrases = (pr.multiWordPhrases||0) + 1;
  const key = words.map(w=>normalizeWord(w.label)).join(' ');
  pr.phrasesSeen = pr.phrasesSeen || [];
  if(!pr.phrasesSeen.includes(key) && pr.phrasesSeen.length < 300) pr.phrasesSeen.push(key);
  recordPhraseUse(p, words.map(w=>w.label).join(' '), words.map(w=>w.emoji||'').join(''), 'f', words.length, words.map(w=>w.label));
}
// Reproducción palabra por palabra (resalta cada palabra mientras suena).
let wordByWordToken = 0;
async function speakWordByWord(p, words){
  const token = ++wordByWordToken;
  const idx = await ensureVoiceIndex(p.id);
  for(let i=0;i<words.length;i++){
    if(token !== wordByWordToken) return;
    document.querySelectorAll('.sentence-strip .sentence-word').forEach((c,j)=>c.classList.toggle('speaking', j===i));
    const w = words[i];
    if(p.useOwnVoice!==false && idx.has(normalizeWord(w.label))){ await playRecordingClip(p.id, w.label); }
    else{ speak(w.label, p.voiceRate, p.voicePitch); await new Promise(r=>setTimeout(r, 650 + w.label.length*70)); }
    await new Promise(r=>setTimeout(r, 250));
  }
  document.querySelectorAll('.sentence-strip .sentence-word').forEach(c=>c.classList.remove('speaking'));
}

// Fija el ánimo de la mascota y elige una frase para su burbuja. Si opts.speak es true, la dice en voz alta;
// con opts.delayMs, espera ese tiempo antes de hablar (para no pisar el audio de la palabra/juego que ya está sonando).
function setMascotMood(p, mood, opts){
  opts = opts || {};
  const phrase = pickMascotPhrase(p, mood);
  state.mascotMood = (mood==='greet') ? 'idle' : mood;
  state.mascotPhrase = phrase;
  const mascotVisible = !p || !p.visualStyle || p.visualStyle==='infantil';
  if(p && opts.speak && mascotVisible){
    if(opts.delayMs){
      setTimeout(()=>{ if(state.mascotPhrase===phrase) speak(phrase, p.voiceRate, p.voicePitch); }, opts.delayMs);
    }else{
      speak(phrase, p.voiceRate, p.voicePitch);
    }
  }
  return phrase;
}
// Mueve a la mascota a un lugar nuevo de la pantalla, animado (no solo tiembla en la esquina: recorre la pantalla).
// Actúa directo sobre el elemento visible (no llama a render()) para que la transición CSS se vea suave,
// y además guarda la posición en el estado para que no "salte" de vuelta al rincón en el próximo redibujado.
function roamMascot(){
  const widget = document.querySelector('.mascot-widget');
  if(!widget) return;
  const margin = 12, topSafe = 78;
  const w = widget.offsetWidth || 200, h = widget.offsetHeight || 110;
  const maxLeft = Math.max(margin, window.innerWidth - w - margin);
  const maxTop = Math.max(topSafe, window.innerHeight - h - margin);
  const left = Math.round(margin + Math.random()*(maxLeft-margin));
  const top = Math.round(topSafe + Math.random()*(maxTop-topSafe));
  state.mascotPos = { left, top };
  widget.style.left = left+'px';
  widget.style.top = top+'px';
  widget.style.right = 'auto';
  widget.style.bottom = 'auto';
}
// ---------- Interacción directa con la mascota (clic, toque, mouse encima, arrastrar) ----------
let mascotSuppressClickUntil = 0;
let mascotLastTouchAt = 0;
let mascotLastPokePhrase = '';
const MASCOT_POKE_PHRASES = ['¡Jajaja, me hiciste cosquillas!', '¡Hola! ¡Acá estoy!', '¡Uy, qué lindo toque!', '¡Otra vez, otra vez!', '¡Vamos a jugar!', '¡Eso me encanta!', '¡Boing!', '¡Qué divertido!'];
const MASCOT_POKE_PHRASES_NAME = ['¡Jajaja, {name}, me hiciste cosquillas!', '¡Hola, {name}! ¡Acá estoy!', '¡Qué divertido, {name}!', '¡Me encanta jugar con vos, {name}!', '¡Otra vez, {name}, otra vez!'];
const MASCOT_REACTION_KINDS = ['jump','spin','wiggle','dance'];
const MASCOT_HEARTS = ['💜','❤️','⭐','✨','💖'];
// Cambia el texto de la burbuja directamente (sin redibujar toda la app) y, si se pide, lo dice en voz alta.
function mascotSay(p, phrase, opts){
  state.mascotPhrase = phrase;

// Dispara una animación de reacción distinta sobre el avatar (salto, giro, meneo, baile).
function mascotReact(kind){
  const a = document.querySelector('.mascot-avatar');
  if(!a) return;
  MASCOT_REACTION_KINDS.forEach(k=>a.classList.remove('mascot-react-'+k));
  a.classList.remove('mascot-flourish','mascot-hover','mascot-poke');
  void a.offsetWidth; // reinicia la animación aunque se repita la misma
  a.classList.add('mascot-react-'+kind);
  setTimeout(()=>{ try{ a.classList.remove('mascot-react-'+kind); }catch(e){} }, 1050);

// Corazones y estrellitas que salen volando desde la mascota.
function mascotHearts(p, count){

      s.style.top = (r.top + r.height*0.2)+'px';

// Un "boing" sintetizado (sin archivos de audio) al tocarla.
function mascotBoing(p){
  if(!p || p.sensoryEffects===false || p.themeSounds===false) return;
  try{
    const c = getAudioCtx(); if(!c) return;
    const t = c.currentTime;
    fxTone(c, t, 260, 0.18, 'sine', 0.22, 640);
    fxTone(c, t+0.15, 520, 0.14, 'triangle', 0.16, 900);
  }catch(e){}

// Al hacer clic/tocar la mascota: reacciona con animación distinta cada vez, sonido, corazones, vibración y una
// frase hablada (a veces con el nombre del niño/a). Cada 10 toques hace un festejo especial.
function pokeMascot(p){
  markInteraction();
  mascotLastTouchAt = Date.now();
  state.mascotPokeCount = (state.mascotPokeCount||0) + 1;
  const n = state.mascotPokeCount;
  const nm = p ? firstName(p.name) : '';
  let phrase;
  if(n % 10 === 0){
    phrase = nm ? '¡Wow, '+nm+'! ¡Ya jugamos '+n+' veces conmigo! 🎉' : '¡Wow! ¡Ya jugamos '+n+' veces conmigo! 🎉';
  }else{
    let pool = MASCOT_POKE_PHRASES.concat(nm ? MASCOT_POKE_PHRASES_NAME.map(t=>t.replace('{name}', nm)) : []);
    pool = pool.filter(x=>x!==mascotLastPokePhrase);
    phrase = pool[Math.floor(Math.random()*pool.length)];
  }
  mascotLastPokePhrase = phrase;
  mascotSay(p, phrase, {speak:true});
  mascotReact(MASCOT_REACTION_KINDS[n % MASCOT_REACTION_KINDS.length]);
  mascotHearts(p, n % 10 === 0 ? 14 : 6);
  mascotBoing(p);
  hapticFeedback(p, 'good');
  if(n % 10 === 0) bigBurst(p);
}
// Arrastrar con el mouse o el dedo + reacción al pasar el mouse por encima.
function attachMascotInteractions(avatar, widget, p){
  let dragging = false, moved = false, startX = 0, startY = 0, startLeft = 0, startTop = 0, pid = null;
  avatar.addEventListener('pointerdown', (e)=>{
    if(e.button!==undefined && e.button!==0) return;
    const r = widget.getBoundingClientRect();
    startX = e.clientX; startY = e.clientY; startLeft = r.left; startTop = r.top;
    dragging = true; moved = false; pid = e.pointerId;
    try{ avatar.setPointerCapture(e.pointerId); }catch(_){}
  });
  avatar.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    const dx = e.clientX-startX, dy = e.clientY-startY;
    if(!moved){
      if(Math.hypot(dx,dy) < 8) return;
      moved = true;
      state.mascotDragging = true;
      widget.classList.add('mascot-dragging');
      avatar.classList.remove('mascot-hover','mascot-flourish');
      mascotSay(p, '¡Wiii! ¡Llevame a pasear!');
    }
    const left = Math.max(0, Math.min(startLeft+dx, window.innerWidth - widget.offsetWidth));
    const top = Math.max(0, Math.min(startTop+dy, window.innerHeight - widget.offsetHeight));
    widget.style.left = left+'px'; widget.style.top = top+'px';
    widget.style.right = 'auto'; widget.style.bottom = 'auto';
  });
  const end = ()=>{
    if(!dragging) return;
    dragging = false;
    try{ avatar.releasePointerCapture(pid); }catch(_){}
    if(moved){
      state.mascotPos = { left: parseInt(widget.style.left,10)||0, top: parseInt(widget.style.top,10)||0 };
      state.mascotDragging = false;
      widget.classList.remove('mascot-dragging');
      mascotSuppressClickUntil = Date.now()+300; // para que soltarla no cuente además como un toque
      mascotLastTouchAt = Date.now();
      const nm = p ? firstName(p.name) : '';
      mascotSay(p, nm ? '¡Qué lindo paseo, '+nm+'! 🎈' : '¡Qué lindo paseo! 🎈', {speak:true});
      mascotReact('jump');
      mascotHearts(p, 4);
      mascotBoing(p);
    }
  };
  avatar.addEventListener('pointerup', end);
  avatar.addEventListener('pointercancel', end);
  // Con el mouse encima: se alegra y saluda (en pantallas táctiles no hay "encima", así que no aplica).
  avatar.addEventListener('pointerenter', (e)=>{
    if(e.pointerType!=='mouse' || dragging) return;
    mascotLastTouchAt = Date.now();
    avatar.classList.remove('mascot-flourish');
    avatar.classList.add('mascot-hover');
    const b = widget.querySelector('.mascot-bubble');
    if(b) b.textContent = '¡Hola! Hacé clic en mí 👆';
  });
  avatar.addEventListener('pointerleave', (e)=>{
    if(e.pointerType!=='mouse') return;
    avatar.classList.remove('mascot-hover');
    const b = widget.querySelector('.mascot-bubble');
    if(b && state.mascotPhrase) b.textContent = state.mascotPhrase;
  });
}
// Reacción visual de la mascota a una palabra puntual del tablero (una burbuja con el emoji que aparece y sube).
function mascotWordReaction(label){

// Vibración corta en aciertos/errores (si el dispositivo y el perfil lo permiten). En modo "alto" es más larga.
function hapticFeedback(p, type){
  if(!p || p.sensoryEffects===false) return;
  try{
    if(!('vibrate' in navigator)) return;
    const alto = p.sensoryIntensity==='alto';
    if(type==='good') navigator.vibrate(alto ? [90,40,90] : 80);
    else navigator.vibrate(alto ? [70,60,70,60,70] : [60,80,60]);
  }catch(e){}
}
// Chispitas + anillo de color en el punto tocado (efecto multisensorial). En modo "alto" hay más piezas, más grandes y dura más.
function sparkAt(targetEl, p){
  if(!p || p.sensoryEffects===false || p.visualStyle==='adulto' || !targetEl) return;
  try{
    const alto = p.sensoryIntensity==='alto';
    const rect = targetEl.getBoundingClientRect();
    const layer = document.createElement('div');
    layer.className = 'spark-layer';
    layer.style.left = (rect.left+rect.width/2)+'px';
    layer.style.top = (rect.top+rect.height/2)+'px';
    const ring = document.createElement('div');
    ring.className = 'spark-ring'+(alto?' spark-ring-big':'');
    layer.appendChild(ring);
    if(alto){ const ring2 = document.createElement('div'); ring2.className='spark-ring spark-ring-big'; ring2.style.animationDelay='.15s'; layer.appendChild(ring2); }
    const pieces = ['✨','⭐','🎉','💫','🌟'];
    const count = alto ? 10 : 6;
    for(let i=0;i<count;i++){
      const s = document.createElement('span');
      s.textContent = pieces[i%pieces.length];
      s.className = 'spark-piece'+(alto?' spark-piece-big':'');
      s.style.setProperty('--angle', (i*(360/count)+Math.random()*20)+'deg');
      layer.appendChild(s);
    }
    document.body.appendChild(layer);
    setTimeout(()=>layer.remove(), alto?1200:900);
  }catch(e){}
}
// Busca una palabra por su texto en todo el vocabulario disponible del perfil (para la fila de predicción).
function findWordByLabel(p, label){
  const norm = normalizeWord(label);
  for(const c of CORE_CATEGORIES){ const hit = c.words.find(w=>normalizeWord(w.label)===norm); if(hit) return hit; }
  const theme = THEMES[p.theme];
  if(theme){ const hit = theme.words.find(w=>normalizeWord(w.label)===norm); if(hit) return hit; }
  if(p.customWords){ const hit = p.customWords.find(w=>normalizeWord(w.label)===norm); if(hit) return hit; }
  for(const cc of (p.customCategories||[])){ const hit = cc.words.find(w=>normalizeWord(w.label)===norm); if(hit) return hit; }
  return { label, emoji: PRED_EMOJI[norm] || '💬' };
}
// Racha de aciertos consecutivos en los juegos de práctica (para logros y frase especial de la mascota).
function registerStreak(p, correct){
  if(correct) bigBurst(p);
  state.correctStreak = correct ? (state.correctStreak||0)+1 : 0;
  if(correct && state.correctStreak > (p.progress.bestStreak||0)) p.progress.bestStreak = state.correctStreak;
  if(correct && state.correctStreak===5){
    setTimeout(()=>speak(firstName(p.name) ? `¡Ya estás aprendiendo mucho, ${firstName(p.name)}! 🌟` : MASCOT_STREAK, p.voiceRate, p.voicePitch), 900);
  }
}

async function afterProgressUpdate(p){

  const newly = ACHIEVEMENTS.filter(a=>!before.has(a.id) && a.check(p.progress));

const el = (tag, attrs={}, children=[]) => {
  const node = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(v==null) return;
    if(k==='class') node.className=v;
    else if(k==='style') node.setAttribute('style', v);
    else if(k==='html') node.innerHTML=v;
    else if(k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else if(k==='disabled'){ if(v) node.setAttribute('disabled','disabled'); }
    else node.setAttribute(k,v);
  });
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    node.appendChild(typeof c==='string' ? document.createTextNode(c) : c);
  });
  return node;
};

// ---------- Voz ----------
// Habla un texto en voz alta. Si la síntesis ya está hablando, primero cancela y espera
// un instante antes de lanzar la nueva frase — en Chrome/Android, cancelar y hablar en el
// mismo instante hace que el audio se pierda o se desfase. Esperar ~60ms lo evita.
function speak(text, rate=0.9, pitch=1.05){
  try{
    if(!('speechSynthesis' in window)) return;
    if(currentPlayingAudio){ try{ currentPlayingAudio.pause(); currentPlayingAudio.currentTime=0; }catch(e){} currentPlayingAudio=null; }
    const synth = window.speechSynthesis;
    const doSpeak = ()=>{
      const clean = String(text).replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu,'').replace(/\s+/g,' ').trim();
      if(!clean) return;
      const u = new SpeechSynthesisUtterance(clean);
      u.lang='es-ES';
      const esVoice = getBestSpanishVoice();
      if(esVoice) u.voice = esVoice;
      u.rate = rate; u.pitch = pitch;
      synth.speak(u);
    };
    if(synth.speaking || synth.pending){
      synth.cancel();
      setTimeout(doSpeak, 60);
    }else{
      doSpeak();
    }
  }catch(e){}
}
if('speechSynthesis' in window){ window.speechSynthesis.onvoiceschanged = ()=>{ bestVoiceCache=null; }; }
// Elige la mejor voz en español disponible: prioriza voces de red/Google (suenan mucho más naturales
// que las robóticas locales) y, entre esas, las de variante latinoamericana antes que las de España.
let bestVoiceCache = null;
function getBestSpanishVoice(){
  if(bestVoiceCache) return bestVoiceCache;
  try{
    const voices = window.speechSynthesis.getVoices().filter(v=>v.lang && v.lang.toLowerCase().startsWith('es'));
    if(voices.length===0) return null;
    const score = v=>{
      let s = 0;
      if(/google/i.test(v.name)) s += 5;
      if(v.localService===false) s += 3;
      const lang = v.lang.toLowerCase();
      if(lang==='es-419' || lang==='es-us' || lang==='es-ar' || lang==='es-mx') s += 2;
      else if(lang==='es-es') s += 1;
      if(/female|mujer/i.test(v.name)) s += 1;
      return s;
    };
    voices.sort((a,b)=>score(b)-score(a));
    bestVoiceCache = voices[0];
    return bestVoiceCache;
  }catch(e){ return null; }
}

// Exporta todas las grabaciones de voz del perfil a un archivo .json descargable.
async function exportVoiceRecordings(p){
  const idx = await ensureVoiceIndex(p.id);
  if(idx.size===0){ alert('Este perfil todavía no tiene grabaciones de voz guardadas.'); return; }
  const clips = {};
  for(const key of idx){
    try{ const res = await Storage.get('voice-clip:'+p.id+':'+key); if(res && res.value) clips[key]=res.value; }catch(e){}
  }
  const payload = { app:'Comunica+', profileName:p.name, exportedAt:new Date().toISOString(), clips };
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const safeName = (p.name||'perfil').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-') || 'perfil';
  a.download = `voces_${safeName}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
// Importa un archivo .json exportado previamente y agrega esas grabaciones al perfil actual.
async function importVoiceRecordings(p, file){
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || typeof data.clips !== 'object') throw new Error('formato inválido');
    const idx = await ensureVoiceIndex(p.id);
    let count = 0;
    for(const [key, val] of Object.entries(data.clips)){
      try{ await Storage.set('voice-clip:'+p.id+':'+key, val); idx.add(key); count++; }catch(err){}
    }
    await saveVoiceIndex(p.id, idx);
    alert(`Se importaron ${count} grabaciones de voz.`);
    render();
  }catch(err){
    alert('No se pudo leer el archivo. Verificá que sea un backup de Comunica+ válido (.json).');
  }
}
// ---------- Escaneo automático / acceso por switch ----------
// Pensado para personas que no pueden tocar un botón específico con precisión (parálisis cerebral,
// ELA, movilidad reducida). La app recorre sola los botones marcados como ".scan-item" y resalta uno
// a la vez; la persona activa un único "interruptor" (tocar cualquier parte de la pantalla, la tecla
// Espacio/Enter, o un switch externo Bluetooth que emula esas teclas) para elegir el que está iluminado.
let scanTargets = [];
let scanIdx = -1;
let scanTimerId = null;
function stopScanning(){
  if(scanTimerId){ clearInterval(scanTimerId); scanTimerId = null; }
  scanTargets.forEach(el=>{ try{ el.classList.remove('scan-active'); }catch(e){} });
  scanTargets = [];
  scanIdx = -1;
}
function highlightScan(p){
  scanTargets.forEach((el,i)=> el.classList.toggle('scan-active', i===scanIdx));
  const current = scanTargets[scanIdx];
  if(current){
    try{ current.scrollIntoView({block:'nearest', behavior:'smooth'}); }catch(e){}
    if(p.scanAudio!==false){
      const label = current.getAttribute('data-scan-label') || current.textContent.trim();
      if(label) speak(label, p.voiceRate, p.voicePitch);
    }
  }
}
function advanceScan(p){
  if(scanTargets.length===0) return;
  scanIdx = (scanIdx+1) % scanTargets.length;
  highlightScan(p);
}
// Activa (o reinicia) el recorrido según lo que haya marcado como escaneable en la pantalla actual.
// Si la cantidad de botones no cambió respecto de la pasada anterior, mantiene dónde iba (no vuelve al inicio).
function setupScanning(p){
  const prevLen = scanTargets.length;
  const prevIdx = scanIdx;
  if(scanTimerId){ clearInterval(scanTimerId); scanTimerId = null; }
  scanTargets.forEach(el=>{ try{ el.classList && el.classList.remove('scan-active'); }catch(e){} });
  if(!p || !p.scanningEnabled){ scanTargets = []; scanIdx = -1; return; }
  scanTargets = Array.from(document.querySelectorAll('#app .scan-item'));
  if(scanTargets.length===0){ scanIdx = -1; return; }
  scanIdx = (prevIdx>=0 && prevIdx<scanTargets.length && scanTargets.length===prevLen) ? prevIdx : 0;
  highlightScan(p);
  scanTimerId = setInterval(()=>advanceScan(p), Math.max(600, p.scanSpeed||1800));
}
// Selecciona (simula un toque sobre) el botón actualmente iluminado.
function selectScan(){
  if(scanTargets.length===0 || scanIdx<0) return;
  const el = scanTargets[scanIdx];
  if(el && !el.disabled) el.click();
}
// El "interruptor": tocar cualquier parte de la pantalla, o las teclas Espacio/Enter (switches externos
// por Bluetooth suelen emular estas teclas), eligen el botón resaltado — sin tener que acertarle con precisión.
document.addEventListener('keydown', (e)=>{
  if(e.code!=='Space' && e.code!=='Enter') return;
  if(e.target && (e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA')) return; // no interferir al escribir
  const p = state.currentId ? state.profilesCache[state.currentId] : null;
  if(p && p.scanningEnabled){ e.preventDefault(); selectScan(); }
});
document.addEventListener('keydown', (e)=>{
  // Atajo en PC: tecla "/" enfoca el buscador del tablero
  if(e.key!=='/' || state.view!=='board') return;
  const t = e.target; if(t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.isContentEditable)) return;
  const inp = document.getElementById('vocab-search');
  if(inp){ e.preventDefault(); inp.focus(); }
});
document.addEventListener('click', (e)=>{
  const p = state.currentId ? state.profilesCache[state.currentId] : null;
  if(!p || !p.scanningEnabled) return;
  if(e.target.closest('.scan-select-btn')) return; // ya lo maneja su propio onclick
  if(e.target.closest('.search-bar')) return; // escribir en el buscador no elige botones
  if(e.target.closest('.mascot-widget')) return; // jugar con la mascota no debe seleccionar botones
  if(e.target.closest('.scan-item')) return; // un toque directo sobre el botón ya lo activa solo
  selectScan();
});

// ---------- Copia de seguridad COMPLETA del perfil (configuración + progreso + logros + voces) ----------
// Exporta todo lo necesario para reconstruir el perfil en otro dispositivo: datos de configuración,
// categorías activas, dificultad, progreso, logros desbloqueados, palabras personalizadas y las
// grabaciones de voz propia. Es más abarcativo que "Exportar grabaciones", que solo guarda las voces.
async function exportFullProfile(p){
  const idx = await ensureVoiceIndex(p.id);
  const voiceClips = {};
  for(const key of idx){
    try{ const res = await Storage.get('voice-clip:'+p.id+':'+key); if(res && res.value) voiceClips[key]=res.value; }catch(e){}
  }
  const imgMemX = await ensureWordImages(p.id);
  const payload = { app:'Comunica+', kind:'full-profile-backup', version:1, exportedAt:new Date().toISOString(), profile:p, voiceClips, wordImages:{ photo:imgMemX.photo, arasaac:imgMemX.arasaac } };
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const safeName = (p.name||'perfil').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-') || 'perfil';
  a.download = `comunica_backup_${safeName}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
// Restaura un backup completo como un perfil NUEVO (nunca pisa uno existente, para evitar pérdidas
// accidentales). El perfil restaurado aparece en la lista de perfiles con el mismo nombre y datos.
async function importFullProfile(file){
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || data.kind!=='full-profile-backup' || !data.profile) throw new Error('formato inválido');
    const newId = 'p_'+Date.now();
    const restored = withDefaults(Object.assign({}, data.profile, { id:newId }));
    await saveProfile(restored);
    state.profileIds.push(newId);
    await saveProfileList();

    if(data.voiceClips && typeof data.voiceClips==='object'){
      const idx = await ensureVoiceIndex(newId);
      for(const [key,val] of Object.entries(data.voiceClips)){
        try{ await Storage.set('voice-clip:'+newId+':'+key, val); idx.add(key); voiceCount++; }catch(e){}
      }
      await saveVoiceIndex(newId, idx);
    }
    let imgCount = 0;

// Referencia al audio grabado que está sonando ahora, para poder cortarlo si se toca otra palabra
// enseguida (evita que se superpongan dos sonidos y "se desfasen").
let currentPlayingAudio = null;
function stopAllAudio(){
  try{ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }catch(e){}
  if(currentPlayingAudio){ try{ currentPlayingAudio.pause(); currentPlayingAudio.currentTime = 0; }catch(e){} currentPlayingAudio = null; }
}
async function playRecordingClip(profileId, label){
  const key = 'voice-clip:'+profileId+':'+normalizeWord(label);
  try{
    const res = await Storage.get(key);
    if(!res || !res.value) return false;
    stopAllAudio();
    await new Promise(resolve=>{
      const audio = new Audio(res.value);
      currentPlayingAudio = audio;
      audio.onended = ()=>{ if(currentPlayingAudio===audio) currentPlayingAudio=null; resolve(); };
      audio.onerror = ()=>{ if(currentPlayingAudio===audio) currentPlayingAudio=null; resolve(); };
      audio.play().catch(()=>{ if(currentPlayingAudio===audio) currentPlayingAudio=null; resolve(); });
    });
    return true;
  }catch(e){ return false; }
}
// ---------- Sonidos temáticos (sintetizados con Web Audio: sin archivos externos, funcionan sin internet) ----------
let audioCtx = null;
function getAudioCtx(){
  try{
    if(!audioCtx){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null; audioCtx = new AC(); }
    if(audioCtx.state==='suspended') audioCtx.resume();
    return audioCtx;
  }catch(e){ return null; }
}
function fxTone(c, t0, freq, dur, type, vol, slideTo){
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0+dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+dur+0.05);
}
function fxNoise(c, t0, dur, vol, filterFreq, filterType){
  const len = Math.max(1, Math.floor(c.sampleRate*dur));
  const buf = c.createBuffer(1, len, c.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type = filterType || 'lowpass'; f.frequency.value = filterFreq || 1000;
  const g = c.createGain();
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  src.connect(f); f.connect(g); g.connect(c.destination);
  src.start(t0); src.stop(t0+dur);
}

function playThemeSound(p, word){
  if(!p || p.themeSounds===false || !word) return;
  const fn = SOUND_FX[normalizeWord(word.label)];
  if(!fn) return;
  const c = getAudioCtx();
  if(!c) return;
  try{ fn(c, c.currentTime+0.01); }catch(e){}
}
// Habla una palabra: usa la grabación real si existe y está habilitada, si no, voz sintética.
async function speakItem(p, word){
  playThemeSound(p, word);
  if(p.useOwnVoice!==false){
    const idx = await ensureVoiceIndex(p.id);
    if(idx.has(normalizeWord(word.label))){
      const played = await playRecordingClip(p.id, word.label);
      if(played) return;
    }
  }
  speak(word.label, p.voiceRate, p.voicePitch);
}
// Habla una frase completa: si TODAS las palabras tienen grabación propia, las encadena; si no, sintetiza la frase entera.
async function speakSentence(p, words){
  if(p.useOwnVoice!==false && words.length>0){
    const idx = await ensureVoiceIndex(p.id);
    const allRecorded = words.every(w=>idx.has(normalizeWord(w.label)));
    if(allRecorded){
      for(const w of words){ await playRecordingClip(p.id, w.label); }
      return;
    }
  }
  speak(words.map(w=>w.label).join(' '), p.voiceRate, p.voicePitch);
}

// ---------- Dificultad progresiva automática ----------
// Sube sola según los aciertos acumulados en los ejercicios de práctica.
const OPTION_THRESHOLDS = [0, 3, 9, 18, 30];   // aciertos necesarios -> nº de opciones 2,3,4,5,6
const SEQ_THRESHOLDS    = [0, 10, 25];         // aciertos necesarios -> longitud de frase 2,3,4
function getOptionsCount(p){
  if(!p.autoDifficulty) return Math.max(2, Math.min(6, p.manualOptions||4));
  const c = p.progress.practiceCorrect||0;
  let n = 2;
  for(let i=1;i<OPTION_THRESHOLDS.length;i++){ if(c>=OPTION_THRESHOLDS[i]) n = i+2; }
  return n;
}
function getSequenceLen(p){
  if(!p.autoDifficulty) return Math.max(2, Math.min(4, p.manualSeqLen||3));
  const c = p.progress.practiceCorrect||0;
  let n = 2;
  for(let i=1;i<SEQ_THRESHOLDS.length;i++){ if(c>=SEQ_THRESHOLDS[i]) n = i+2; }
  return n;
}

// ---------- Gráficos simples en SVG para el reporte ----------
function donutChartSVG(correct, total){
  const pct = total>0 ? Math.round(100*correct/total) : 0;
  const r = 46, c = 2*Math.PI*r;
  const offset = c - (pct/100)*c;
  return `<svg viewBox="0 0 120 120" width="140" height="140">
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="#E4E0F3" stroke-width="14"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="#6E5DE0" stroke-width="14"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" stroke-linecap="round"
      transform="rotate(-90 60 60)"/>
    <text x="60" y="56" text-anchor="middle" font-family="'Baloo 2',sans-serif" font-weight="800" font-size="26" fill="#2B2640">${pct}%</text>
    <text x="60" y="76" text-anchor="middle" font-family="'Atkinson Hyperlegible',sans-serif" font-size="11" fill="#6B6480">de aciertos</text>
  </svg>`;
}
function barChartSVG(items){
  const max = Math.max(1, ...items.map(i=>i.value));
  const barH = 24, gap = 16, leftPad = 150, rightPad = 34, chartW = 220;
  const totalH = items.length*(barH+gap);
  let bars = '';
  items.forEach((it,idx)=>{
    const y = idx*(barH+gap);
    const w = Math.max(4, Math.round((it.value/max)*chartW));
    bars += `<text x="${leftPad-10}" y="${y+barH/2+5}" text-anchor="end" font-family="'Atkinson Hyperlegible',sans-serif" font-size="12.5" fill="#2B2640">${it.label}</text>
      <rect x="${leftPad}" y="${y}" width="${chartW}" height="${barH}" rx="8" fill="#EDE9FC"/>
      <rect x="${leftPad}" y="${y}" width="${w}" height="${barH}" rx="8" fill="${it.color}"/>
      <text x="${leftPad+chartW+10}" y="${y+barH/2+5}" font-family="'Baloo 2',sans-serif" font-weight="700" font-size="13" fill="#2B2640">${it.value}</text>`;
  });
  const totalW = leftPad+chartW+rightPad;
  return `<svg viewBox="0 0 ${totalW} ${totalH}" width="100%" style="max-width:${totalW}px;">${bars}</svg>`;
}
// Construye el "recorte" visual de una pieza del rompecabezas. Usa una etiqueta <img> real
// (igual que el resto de la app, que sí carga siempre) en vez de solo un fondo CSS, y si esa
// imagen puntual llegara a fallar, muestra el emoji directo como respaldo — nunca queda en blanco.
// Arma la "ventana" de una pieza del rompecabezas: un emoji grande (del tamaño del rompecabezas
// completo) posicionado de forma que solo se vea el pedacito que corresponde a esa pieza, recortado
// por el "overflow:hidden" del contenedor. Usa applyEmojiIcons (el mismo mecanismo ya comprobado que
// muestra todos los demás emojis de la app a color) en lugar de depender de una URL armada a mano o de
// un <canvas>, que podían fallar en algunos dispositivos — esto queda resuelto al instante, sin esperas.
function puzzlePieceVisual(word, cell, FRAME_PX, row, col){
  const box = document.createElement('div');
  box.className = 'piece-bg';
  box.style.cssText = `width:${cell}px;height:${cell}px;position:relative;overflow:hidden;`;
  const span = document.createElement('span');
  span.textContent = word.emoji;
  span.style.cssText = `position:absolute; left:${-col*cell}px; top:${-row*cell}px; font-size:${FRAME_PX}px; line-height:1; display:block;`;
  box.appendChild(span);
  applyEmojiIcons(box);
  return box;
}
function getPuzzleSize(p){
  if(!p.autoDifficulty) return Math.max(2, Math.min(3, p.manualPuzzleSize||2));
  return getOptionsCount(p) >= 4 ? 3 : 2;
}

// ---------- Render raíz ----------
async function render(){
  const app = $('#app');
  const micNeeded = state.view==='practice-say' || ((state.view==='board' || state.view==='messages') && state.recordingWord);

function applyEmojiIcons(root){
  try{
    if(window.twemoji){
      twemoji.parse(root, { className:'emoji', callback:(icon)=>{
        const svg = TWEMOJI_LOCAL[icon];
        return svg ? 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg) : false; // sin dibujo guardado → emoji nativo del dispositivo
      } });
    }
  }catch(e){}
}
